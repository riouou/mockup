<!doctype html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AmiWho — interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AMIWHO DESIGN SYSTEM
   Type: one family; 11 / 13 / 15 / 17 / 20 / 24 / 30.
   Space: 4px scale (--s-1 … --s-12). Radii: 8 / 10 / 12 / 16 / pill;
          sheet and device radii are structural.
   Colour: one deep teal primary; warm neutral scale; semantic pos/neg/warn/info.
           Contrast (light): ink 16.7:1, ink-2 6.9:1, ink-3 5.6:1,
           white on primary 8.1:1, semantic chips 5.4:1+.
   Elevation: borders first; --e-1 for controls, --e-2 for overlays only.
   Charts: teal / slate / sand / ink; muted grid; tabular numerals; A$.
   Copy: sentence case; specific; A$12,480; 12 Nov 2026; no hype.
   ============================================================ */
:root{
  --font-sans:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;

  /* Type: 11 / 13 / 15 / 17 / 20 / 24 / 30. Seven steps, one family. */
  --text-2xs:11px; --text-xs:13px; --text-sm:13px; --text-base:15px; --text-md:17px; --text-lg:20px; --text-xl:24px; --text-2xl:30px;

  /* Spacing: 4px base. */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px;

  /* Radii: control, button, card, pill. Sheet and device are structural. */
  --r-sm:8px; --r-control:10px; --r-btn:12px; --r-card:16px; --r-pill:999px; --r-sheet:24px; --r-device:56px; --r-tablet:38px;

  /* Elevation: borders first, two shadows for overlays. */
  --e-1:0 1px 2px rgba(21,32,29,.07);
  --e-2:0 16px 40px rgba(21,32,29,.18);
  --device-edge:#C9C5BA;
  --e-device:0 0 0 1px var(--device-edge),0 2px 4px rgba(21,32,29,.10),0 40px 80px -40px rgba(21,32,29,.55);
  --dur:160ms;

  /* Surfaces and text. Contrast (light): ink 16.7:1, ink-2 6.9:1, ink-3 5.6:1
     on white; ink-3 4.8:1 on surface-3. */
  --stage:#E8E5DD; --stage-2:#F1EFE8; --line:#D6D2C8;
  --bg:#F6F5F0; --surface:#FFFFFF; --surface-2:#FAF9F5; --surface-3:#F0EEE8;
  --border:#E4E1D8; --border-strong:#CFCBBF; --border-control:#8B8F86;
  --ink:#15201D; --ink-2:#4E5D58; --ink-3:#5E6B66;

  /* Brand and semantics. on-primary/primary 8.1:1; chips 5.4:1+ on their tints. */
  --primary:#0B5A52; --primary-press:#08463F; --primary-soft:#E2EEE9; --on-primary:#FFFFFF;
  --pos:#0F6B44; --pos-soft:#E1F0E7;
  --neg:#A33326; --neg-soft:#F7E5E1;
  --warn:#855600; --warn-soft:#F6EDD8;
  --info:#2E5A7A; --info-soft:#E7EFF5;

  /* Charts: teal, slate, sand, ink. No rainbow. */
  --chart-1:var(--primary); --chart-2:#5A7480; --chart-3:#A98B4F; --chart-4:var(--ink);

  /* Document covers: flat stock colours. White text is AA on all five. */
  --cover-teal:#0E5C54; --cover-clay:#8E4A33; --cover-sand:#6F5726; --cover-slate:#405A66; --cover-olive:#4F5B31;
  --on-cover:#FFFFFF;

  /* Fixed brand panel and paper. These do not flip with the theme. */
  --brand-deep:#0B4A45; --on-brand:#F3F8F5; --on-brand-2:rgba(243,248,245,.78);
  --paper:#FFFFFF; --paper-soft:#F6F8F5; --paper-ink:#16201D; --paper-2:#3F4D48; --paper-3:#68756F; --paper-rule:#E7E4DC; --paper-accent:#0B5A52;

  --device-black:#000; --on-danger:#FFFFFF; --switch-knob:#FFFFFF;
  --apple-bg:#000000; --apple-ink:#FFFFFF;
  --scrim:rgba(8,13,11,.38); --shimmer:rgba(255,255,255,.45);
  --focus:#2D7FF9; /* functional focus colour, not a brand colour */
  --fit:1;
}
[data-theme="dark"]{
  --stage:#080B0A; --stage-2:#0C1110; --line:#1E2724;
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2421; --surface-3:#212B27;
  --border:#2A3732; --border-strong:#3A4A44; --border-control:#667571;
  --ink:#EAF0ED; --ink-2:#A4B2AC; --ink-3:#95A39D;

  --primary:#7AC9BA; --primary-press:#94D6C9; --primary-soft:#16312B; --on-primary:#06231E;
  --pos:#56C287; --pos-soft:#10301F;
  --neg:#F08A77; --neg-soft:#381A15;
  --warn:#DDB05C; --warn-soft:#30250F;
  --info:#8FB8D6; --info-soft:#132633;

  --chart-1:var(--primary); --chart-2:#8CA4AF; --chart-3:#D2B36F; --chart-4:var(--ink);

  --device-edge:#2B3833;
  --e-1:0 1px 2px rgba(0,0,0,.4);
  --e-2:0 16px 40px rgba(0,0,0,.55);
  --e-device:0 0 0 1px var(--device-edge),0 2px 4px rgba(0,0,0,.50),0 40px 80px -30px rgba(0,0,0,.85);
  --on-danger:#1A0F0C; --switch-knob:#EAF0ED;
  --apple-bg:#FFFFFF; --apple-ink:#000000;
  --scrim:rgba(0,0,0,.55); --shimmer:rgba(255,255,255,.07);
  --focus:#8CB4FF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
input,select,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ============================================================
   DEMO CHROME
   ============================================================ */
.demo-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:var(--s-4);padding:var(--s-2) var(--s-5);background:var(--stage);border-bottom:1px solid var(--line);flex-wrap:wrap}
.db-controls{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl span{font-size:var(--text-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ctl select{appearance:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);height:32px;padding:0 26px 0 var(--s-2);font-size:var(--text-xs);font-weight:500;color:var(--ink);background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.seg{display:flex;gap:2px;background:var(--surface-3);border-radius:var(--r-control);padding:2px;border:1px solid var(--border)}
.seg button{height:28px;padding:0 var(--s-2);border-radius:var(--r-sm);font-size:var(--text-xs);font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--e-1)}
.db-btn{display:inline-flex;align-items:center;gap:var(--s-1);height:32px;padding:0 var(--s-2);border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);font-size:var(--text-xs);font-weight:600;color:var(--ink-2)}
.db-btn:hover{color:var(--ink)}
.db-sep{width:1px;height:24px;background:var(--border-strong)}
.stage{display:flex;justify-content:center;align-items:flex-start;gap:var(--s-10);padding:var(--s-6) var(--s-6) var(--s-10);min-height:calc(100vh - 106px)}
.slot{display:flex;flex-direction:column;gap:var(--s-2);flex:none;zoom:var(--fit);transform-origin:top center}
.slot.hidden{display:none}
.slot-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;min-height:20px}
.slot-head .lbl{font-size:var(--text-2xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.slot-head .lbl b{color:var(--ink-2);font-weight:600;text-transform:none;letter-spacing:0;font-size:11px;margin-left:6px}
.slot-head .rot{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-2xs);font-weight:600;color:var(--primary);white-space:nowrap}
.hint{max-width:900px;margin:0 auto var(--s-8);padding:0 var(--s-6);font-size:var(--text-xs);line-height:1.6;color:var(--ink-2);text-align:center}
.hint b{color:var(--ink);font-weight:600}
kbd{font:inherit;font-size:var(--text-2xs);font-weight:600;background:var(--surface);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 4px}

/* ============================================================
   DEVICE
   ============================================================ */
.device{position:relative;background:var(--bg);color:var(--ink);border-radius:var(--r-device);box-shadow:var(--e-device);isolation:isolate;overflow:hidden;width:393px;height:852px;flex:none}
.device.pad{width:820px;height:1180px;border-radius:var(--r-tablet)}
.device.pad.landscape{width:1180px;height:820px}
.app{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:var(--r-pill);background:var(--device-black);z-index:40}
.statusbar{flex:none;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 9px;font-size:var(--text-md);font-weight:600;letter-spacing:-.01em;z-index:30}
.sb-icons{display:flex;align-items:center;gap:var(--s-2)}
.pad .statusbar{height:26px;align-items:center;padding:0 22px;font-size:var(--text-xs)}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:45;pointer-events:none}

/* ============================================================
   APP CHROME
   ============================================================ */
.nav{flex:none;height:48px;display:flex;align-items:center;gap:var(--s-2);padding:0 12px;z-index:20}
.nav .nav-title{font-size:var(--text-md);font-weight:600;letter-spacing:-.01em;margin:0 auto;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .nav-side{display:flex;align-items:center;gap:4px;min-width:76px}
.nav .nav-side.right{justify-content:flex-end}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-pill);color:var(--primary);flex:none}
.icon-btn:hover{background:var(--surface-3)}
.lg-head{flex:none;padding:var(--s-1) var(--s-4) var(--s-3);display:flex;align-items:flex-start;gap:var(--s-2)}
.lg-head .h{flex:1;min-width:0}
.lg-head h1{font-size:var(--text-2xl);line-height:1.08;letter-spacing:-.028em;font-weight:700}
.lg-head .sub{font-size:var(--text-xs);color:var(--ink-2);margin-top:var(--s-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-head .spacer{display:flex;align-items:center;gap:8px;flex:none}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 var(--s-4) var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);scrollbar-width:none;z-index:10;overscroll-behavior:contain}
/* Scroll the column; never squash cards to fit. */
.content > *,.pad-content > *{flex-shrink:0}
.content::-webkit-scrollbar{display:none}
.content.plain{padding:0;gap:0}
.tabbar{flex:none;height:83px;display:grid;grid-template-columns:repeat(5,1fr);padding:var(--s-2) 6px 0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(24px);border-top:1px solid var(--border);z-index:30;position:relative}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--text-2xs);font-weight:500;color:var(--ink-3);padding-top:var(--s-1);min-height:44px}
.tab.active{color:var(--primary);font-weight:600}
.tab .badge{position:absolute;transform:translate(12px,-3px);background:var(--neg);color:var(--on-danger);font-size:var(--text-2xs);font-weight:700;min-width:17px;height:17px;border-radius:var(--r-pill);display:grid;place-items:center;padding:0 var(--s-1)}

/* ipad shell */
.pad-body{flex:1;min-height:0;display:flex;gap:10px;padding:0 10px 10px}
.sidebar{flex:none;width:264px;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s-3) var(--s-2) var(--s-2);overflow:hidden}
.pad:not(.landscape) .sidebar{width:232px}
.pad .sidebar.collapsed{width:76px}
.sidebar{transition:width var(--dur) ease, padding var(--dur) ease}
.sidebar.collapsed{width:76px;padding-left:6px;padding-right:6px}
.side-toggle{margin-left:auto;width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-3);flex:none}
.side-toggle:hover{background:var(--surface-3);color:var(--ink)}
.sidebar.collapsed .side-brand{flex-direction:column;gap:var(--s-1);padding:2px 0 var(--s-2)}
.sidebar.collapsed .side-toggle{margin-left:0}
.sidebar.collapsed .brand-name,.sidebar.collapsed .side-label,.sidebar.collapsed .ws-label,.sidebar.collapsed .ws-name,.sidebar.collapsed .side-user .grow,.sidebar.collapsed .side-user>svg{display:none}
.sidebar.collapsed .side-sec{height:1px;padding:0;margin:var(--s-2) 6px;background:var(--border);color:transparent;overflow:hidden;font-size:0}
.sidebar.collapsed .side-item{justify-content:center;padding:0;position:relative}
.sidebar.collapsed .side-item .count{position:absolute;top:2px;right:4px;margin:0}
.sidebar.collapsed .ws-row{display:none}
.sidebar.collapsed .side-user{justify-content:center;padding-left:0;padding-right:0}
.side-brand{display:flex;align-items:center;gap:var(--s-2);padding:2px var(--s-2) var(--s-3);font-weight:600;letter-spacing:-.02em;font-size:var(--text-base)}
.side-sec{font-size:var(--text-2xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:var(--s-3) var(--s-2) var(--s-1)}
.side-item{display:flex;align-items:center;gap:var(--s-2);height:44px;width:100%;padding:0 var(--s-2);border-radius:var(--r-control);font-size:var(--text-sm);font-weight:500;color:var(--ink-2);text-align:left}
.side-item svg{color:var(--ink-3);flex:none}
.side-item:hover{background:var(--surface-3)}
.side-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side-item.active svg{color:var(--primary)}
.side-item .count{margin-left:auto;font-size:var(--text-2xs);font-weight:700;background:var(--neg);color:var(--on-danger);border-radius:var(--r-pill);min-width:17px;height:17px;display:grid;place-items:center;padding:0 5px}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:10px}
.ws-label{font-size:var(--text-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:2px var(--s-2) var(--s-1)}
.ws-row{display:flex;align-items:center;gap:var(--s-2);height:44px;width:100%;padding:0 var(--s-2);border-radius:var(--r-control);font-size:var(--text-xs);color:var(--ink-2);text-align:left}
.ws-row:hover{background:var(--surface-3)}
.ws-row.on{background:var(--surface);border:1px solid var(--border);color:var(--ink);font-weight:600}
.ws-row .dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.ws-row.on .dot{background:var(--pos)}
.side-user{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-2) var(--s-1);margin-top:var(--s-1);border-top:1px solid var(--border);width:100%;text-align:left;min-height:44px}
.side-user .nm{font-size:var(--text-xs);font-weight:600;line-height:1.25}
.side-user .rl{font-size:var(--text-2xs);color:var(--ink-3)}
.pad-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s-3);padding:var(--s-2) var(--s-4) var(--s-2) var(--s-2);min-height:0}
.pad-head{flex:none;display:flex;align-items:flex-start;gap:16px;min-width:0}
.pad-head .pt{flex:1;min-width:0}
.pad-head h1{font-size:var(--text-xl);line-height:1.12;letter-spacing:-.025em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad-head .sub{font-size:var(--text-xs);color:var(--ink-2);margin-top:var(--s-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad-head .actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.pad-content{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s-3);padding-right:2px;scrollbar-width:none;overscroll-behavior:contain}
.pad-content::-webkit-scrollbar{display:none}

/* ============================================================
   APP COMPONENTS
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s-4);min-width:0}
.card:has(.tbl){overflow-x:auto}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-2);min-width:0}
.card-h h4{font-size:var(--text-sm);font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.card-h .sub{font-size:var(--text-2xs);color:var(--ink-3);white-space:nowrap}
.card-h .more{margin-left:auto;font-size:var(--text-xs);font-weight:600;color:var(--primary);white-space:nowrap;padding:var(--s-1) 0}
.label{font-size:var(--text-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sec-title{font-size:var(--text-sm);font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:var(--s-2)}
.sec-title .more{margin-left:auto;font-size:var(--text-xs);font-weight:600;color:var(--primary)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.strong{font-weight:600}.b7{font-weight:700}
.t-11{font-size:var(--text-2xs)}.t-12,.t-13{font-size:var(--text-sm)}.t-14,.t-15{font-size:var(--text-base)}.t-16,.t-17{font-size:var(--text-md)}.t-20{font-size:var(--text-lg)}.t-22{font-size:var(--text-xl)}.t-26{font-size:var(--text-2xl)}
.stack{display:flex;flex-direction:column;gap:var(--s-2);min-width:0}
.stack.tight{gap:var(--s-1)}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);min-width:0}
.row{display:flex;align-items:center;gap:var(--s-2);min-width:0}
.grow{flex:1;min-width:0}
.right{text-align:right}
.center{text-align:center}
.wrap{flex-wrap:wrap}
.divider{height:1px;background:var(--border);margin:var(--s-1) 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);height:44px;padding:0 var(--s-4);border-radius:var(--r-btn);font-size:var(--text-base);font-weight:600;letter-spacing:-.005em;white-space:nowrap;flex:none;transition:background-color var(--dur) ease,color var(--dur) ease,border-color var(--dur) ease}
.btn.primary:hover{background:var(--primary-press)}
.btn.secondary:hover{background:var(--border)}
.btn.outline:hover{background:var(--surface-2)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.lg{height:50px;border-radius:var(--r-btn);font-size:var(--text-md)}
.btn.sm{height:44px;border-radius:var(--r-sm);font-size:var(--text-xs);padding:0 var(--s-3)}
.btn.full{width:100%}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{background:var(--surface-3);color:var(--ink)}
.btn.outline{border:1px solid var(--border-control);background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--primary);padding:0 6px}
.btn.apple{background:var(--apple-bg);color:var(--apple-ink)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.sm svg,.btn.lg svg{flex:none}
.tap{position:relative}
.tap:after{content:"";position:absolute;inset:-16px -8px}
.more,.sec-title .more,.card-h .more{position:relative}
.more:after,.sec-title .more:after,.card-h .more:after{content:"";position:absolute;inset:-16px -8px}

.chip{display:inline-flex;align-items:center;gap:var(--s-1);height:24px;padding:0 var(--s-2);border-radius:var(--r-pill);font-size:var(--text-2xs);font-weight:600;white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.neutral{background:var(--surface-3);color:var(--ink-2)}
.chip.primary{background:var(--primary-soft);color:var(--primary)}

select.mini{height:44px;border-radius:var(--r-sm);border:1px solid var(--border-control);background:var(--surface);padding:0 var(--s-2);font-size:var(--text-xs);font-weight:600;color:var(--ink)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);min-height:44px}

.seg2.pill button{min-height:44px;border:1px solid var(--border);border-radius:var(--r-pill);padding:var(--s-3) var(--s-3);font-size:var(--text-xs);flex:none;background:var(--surface)}
.seg2.pill button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}

.chev{color:var(--ink-3);flex:none}
.avatar{width:36px;height:36px;border-radius:var(--r-pill);display:grid;place-items:center;font-size:var(--text-2xs);font-weight:600;background:var(--primary-soft);color:var(--primary);flex:none}
.avatar.sm{width:28px;height:28px;font-size:var(--text-2xs)}
.avatar.lg{width:54px;height:54px;font-size:var(--text-md)}
.lg-head .avatar,.pad-head .avatar{width:44px;height:44px;font-size:var(--text-xs)}

.cover{position:relative;border-radius:var(--r-sm);overflow:hidden;color:var(--on-cover);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s-3);flex:none;border:1px solid rgba(255,255,255,.18);background:var(--cover-teal)}

.cover.t-slate{background:var(--cover-slate)}
.cover.t-olive{background:var(--cover-olive)}
.cover .cover-text{margin-top:auto}
.cover .mono{font-size:20px;font-weight:600;line-height:1;opacity:.92}
.cover .cat{font-size:var(--text-2xs);font-weight:700;letter-spacing:.13em;text-transform:uppercase;opacity:.82}
.cover .ttl{font-size:var(--text-xs);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.cover .ver{font-size:var(--text-2xs);opacity:.78;margin-top:var(--s-1)}
.cover.sm,.cover.mini{display:grid;place-items:center;justify-content:center;align-content:center;padding:0}
.cover.sm .mono,.cover.mini .mono{font-size:var(--text-base)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s-3);min-width:0}

.kpi .val{font-size:var(--text-xl);font-weight:600;letter-spacing:-.025em;margin-top:var(--s-1);font-variant-numeric:tabular-nums}
.kpi .foot{display:flex;align-items:center;gap:var(--s-1);margin-top:var(--s-1);font-size:var(--text-2xs);font-weight:600;white-space:nowrap}

.up{color:var(--pos)}.down{color:var(--neg)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--primary);transition:width var(--dur) ease}
.bar.thin{height:4px}
.bar.warn i{background:var(--warn)}
.bar.pos i{background:var(--pos)}

.chart{position:relative;min-width:0}
.chart svg{width:100%;height:auto;overflow:visible}
.legend{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;font-size:var(--text-2xs);color:var(--ink-2);margin-top:var(--s-2)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}
.tip{position:absolute;transform:translate(-50%,-118%);background:var(--ink);color:var(--bg);font-size:var(--text-2xs);font-weight:600;padding:var(--s-1) var(--s-2);border-radius:var(--r-sm);white-space:nowrap;pointer-events:none;z-index:3;font-variant-numeric:tabular-nums}
.tip:after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--ink)}
.spark{display:block}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:var(--text-2xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:var(--s-2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:var(--s-2);border-bottom:1px solid var(--border);font-size:var(--text-xs);white-space:nowrap}

.tbl.tight th,.tbl.tight td{padding-left:6px;padding-right:6px}

.tbl tr:last-child td{border-bottom:0}

.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .muted{color:var(--ink-2)}

.privacy{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--text-2xs);font-weight:500;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:var(--s-1) var(--s-2);white-space:nowrap}
.privacy svg{color:var(--primary)}
.banner{display:flex;align-items:center;gap:var(--s-2);border-radius:var(--r-control);padding:var(--s-3);font-size:var(--text-xs);font-weight:500;background:var(--primary-soft);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.neg{background:var(--neg-soft);color:var(--neg);border-color:color-mix(in srgb,var(--neg) 25%,transparent)}
.banner .grow{font-weight:500}

/* auth */
.auth{flex:1;display:flex;flex-direction:column;padding:var(--s-1) var(--s-6) var(--s-6);min-height:0;overflow-y:auto;scrollbar-width:none}
.auth::-webkit-scrollbar{display:none}
.wmark{display:flex;align-items:center;gap:var(--s-2);font-weight:600;letter-spacing:-.02em;font-size:var(--text-md)}
.auth h1{font-size:var(--text-2xl);line-height:1.1;letter-spacing:-.03em;font-weight:700;margin-top:var(--s-6)}
.auth .lead{font-size:var(--text-base);line-height:1.5;color:var(--ink-2);margin-top:var(--s-2);max-width:36ch}
.auth .form{margin-top:var(--s-5);display:flex;flex-direction:column;gap:var(--s-3)}
.or{display:flex;align-items:center;gap:var(--s-2);font-size:var(--text-2xs);font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin:var(--s-1) 0}
.or:before,.or:after{content:"";height:1px;background:var(--border);flex:1}
.auth .fine{font-size:var(--text-xs);color:var(--ink-2);text-align:center;margin-top:var(--s-3)}
.link{color:var(--primary);font-weight:600;text-decoration:none}
.auth .spacer{margin-top:auto}
.auth-split{flex:1;display:grid;grid-template-columns:43% 1fr;min-height:0}
.auth-brand{position:relative;background:var(--brand-deep);color:var(--on-brand);padding:var(--s-10);display:flex;flex-direction:column;overflow:hidden}

.auth-brand p{font-size:var(--text-base);line-height:1.55;color:var(--on-brand-2);margin-top:var(--s-3);position:relative;max-width:34ch}
.auth-brand .ab-foot{display:flex;gap:var(--s-3);margin-top:var(--s-6);position:relative;font-size:var(--text-2xs);color:var(--on-brand-2)}
.auth-form{padding:44px 60px;display:flex;flex-direction:column;justify-content:center;gap:var(--s-3);min-width:0;overflow-y:auto;scrollbar-width:none}
.auth-form::-webkit-scrollbar{display:none}
.auth-form h3{font-size:var(--text-xl);letter-spacing:-.025em;font-weight:700}
.auth-form .sub{font-size:var(--text-xs);color:var(--ink-2);margin-bottom:var(--s-1)}

/* sheets */
.dim{position:absolute;inset:0;background:var(--scrim);z-index:60;animation:fade .18s ease}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border-radius:var(--r-sheet);padding:var(--s-2) var(--s-5) var(--s-5);z-index:61;box-shadow:var(--e-2);text-align:center;border:1px solid var(--border);animation:up .18s ease}
.sheet.wide{left:16px;right:16px;text-align:left;padding:var(--s-4) 20px 18px}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 14px}
.sheet .sheet-ic{width:40px;height:40px;border-radius:0;background:transparent;color:var(--primary);display:grid;place-items:center;margin:0 auto var(--s-2)}
.sheet h3{font-size:var(--text-md);font-weight:600;letter-spacing:-.01em}
.sheet p{font-size:var(--text-xs);color:var(--ink-2);margin-top:var(--s-1);line-height:1.45}
.sheet .btn{margin-top:var(--s-3)}
.sheet .list{margin-top:12px;text-align:left}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* secure document paper: fixed white in both themes, like a PDF */
.doc-page{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-rule);border-radius:var(--r-control);padding:var(--s-5);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:360px}
.doc-page .doc-kicker{display:flex;justify-content:space-between;gap:var(--s-3);font-size:var(--text-2xs);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3)}
.doc-page h2{font-size:var(--text-lg);font-weight:700;letter-spacing:-.02em;margin-top:var(--s-4);color:var(--paper-ink)}
.doc-page p{font-size:var(--text-xs);line-height:1.65;color:var(--paper-2);margin-top:var(--s-2);max-width:72ch}
.doc-page .doc-sub{font-size:var(--text-xs);font-weight:600;color:var(--paper-accent);margin-top:var(--s-4)}
.doc-page table{width:100%;border-collapse:collapse;font-size:var(--text-2xs);color:var(--paper-2);margin-top:var(--s-2)}
.doc-page th{text-align:left;font-weight:600;padding:var(--s-1) 0;border-bottom:1px solid var(--paper-rule)}
.doc-page td{padding:var(--s-1) 0;border-bottom:1px solid var(--paper-rule)}
.doc-page tr:last-child td{border-bottom:0}
.doc-page .doc-foot{position:absolute;right:var(--s-4);bottom:var(--s-2);font-size:var(--text-2xs);color:var(--paper-3)}
.doc-page.lg{height:100%;min-height:0;padding:var(--s-6) var(--s-8)}
.doc-page.lg h2{font-size:var(--text-xl)}
.doc-page.lg p{font-size:var(--text-sm)}

/* misc */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s-2);padding:var(--s-8) var(--s-6);min-height:320px}
.empty .e-ic{width:28px;height:28px;border-radius:0;background:transparent;border:0;display:grid;place-items:center;color:var(--primary);margin-bottom:var(--s-1)}

.empty p{font-size:var(--text-sm);color:var(--ink-2);line-height:1.5;max-width:34ch}
.empty .btn{margin-top:var(--s-2)}
.skel{background:var(--surface-3);border-radius:var(--r-sm);position:relative;overflow:hidden}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:var(--text-xs);font-weight:600;padding:var(--s-2) var(--s-4);border-radius:var(--r-pill);z-index:70;box-shadow:var(--e-2);max-width:86%;text-align:center;pointer-events:none}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.steps{display:flex;align-items:center;gap:var(--s-2)}
.step{display:flex;align-items:center;gap:var(--s-2);font-size:var(--text-2xs);font-weight:600;color:var(--ink-3);white-space:nowrap}
.step b{width:24px;height:24px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-size:var(--text-2xs);font-weight:700}
.step.done b{background:var(--pos-soft);color:var(--pos)}
.step.on{color:var(--ink)}
.step.on b{background:var(--primary);color:var(--on-primary)}
.step-line{height:1px;background:var(--border);flex:1;min-width:8px}
.dropzone{border:1px dashed var(--border-strong);border-radius:var(--r-card);padding:var(--s-5);text-align:center;background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.dropzone:hover{border-color:var(--primary)}
.dropzone .dz-ic{width:24px;height:24px;border-radius:0;background:transparent;color:var(--primary);display:grid;place-items:center;margin:0 auto var(--s-2)}
.acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);align-items:start}
.pad.landscape .acct-grid{grid-template-columns:1fr 1fr 1fr}
.only-landscape{display:none}
.pad.landscape .only-landscape{display:block}
.inset{border-top:1px solid var(--border);margin-top:var(--s-3);padding-top:var(--s-3)}
.note-ic{width:20px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.note-ic.pos{color:var(--pos)}
.note-ic.warn{color:var(--warn)}
.app-ic{width:20px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.success-ic{width:40px;height:40px;color:var(--pos);display:grid;place-items:center}
.e-ic.neg{color:var(--neg)}
.frames-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:var(--s-3);min-height:0;align-content:start}
.frames-grid > *{align-self:start}
.catalog-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.pad:not(.landscape) .catalog-grid{grid-template-columns:1fr}
.lib-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--s-3);align-items:start;align-content:start}
.pad:not(.landscape) .lib-grid{grid-template-columns:1fr}
.pad:not(.landscape) .frames-grid{grid-template-columns:1fr}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-3)}
.pad.landscape .dash-grid>.span2{grid-column:span 2}

button.switch{padding:0;border:0}

@media (max-width:900px){
  .demo-bar{padding:8px 12px;gap:10px}

  .stage{padding:16px 8px 24px;gap:20px;flex-wrap:wrap}
  .hint{padding:0 16px}
}

<body>

<header class="demo-bar">
  <div class="db-controls">
    <div class="ctl"><span>Device</span>
      <div class="seg" id="devSeg">
        <button data-dev="phone">iPhone</button>

        <button data-dev="both" class="on">Both</button>
      </div>
    </div>
    <div class="ctl"><span>Appearance</span>

    <label class="ctl"><span>Demo account</span>
      <select id="roleSel">
        <option value="customer">Customer · Alex</option>

    <button class="db-btn" data-act="reset">Reset</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="slot" data-slot="phone">
    <div class="slot-head"><span class="lbl">iPhone 16 Pro <b>393 × 852</b></span><span class="lbl" id="phoneHint"></span></div>
    <div class="device phone" data-device="phone"><div class="app" id="app-phone"></div></div>

function niceMax(v){
  if(!isFinite(v)||v<=0)return 1;
  const mag=Math.pow(10,Math.floor(Math.log10(v))), n=v/mag;
  const f=n<=1?1:n<=1.2?1.2:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10;
  return f*mag;
}
function lineChart({labels,series,w=336,h=148,yMin=0,yMax=null,fmt=v=>v,area=true,tip=null,padL=34,padR=8,padT=12,padB=20,ticks=4}){
  yMax = yMax ?? niceMax(Math.max(...series.flatMap(s=>s.values))*1.12);
  const iw=w-padL-padR, ih=h-padT-padB;
  const X=i=>padL+(labels.length===1?iw/2:(i/(labels.length-1))*iw);
  const Y=v=>padT+ih-((v-yMin)/(yMax-yMin))*ih;
  let g='';
  const nT=(yMax%4===0)?4:5;
  for(let i=0;i<=nT;i++){
    const v=yMin+(yMax-yMin)*i/nT, y=Y(v);
    g+=`<line x1="${padL}" x2="${w-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity="${i===0?.9:.6}"/>`;
    g+=`<text x="${padL-6}" y="${(y+3.2).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  const step=Math.ceil(labels.length/6);
  labels.forEach((l,i)=>{
    if(i%step===0||i===labels.length-1){
      g+=`<text x="${X(i).toFixed(1)}" y="${h-5}" text-anchor="${i===0?'start':(i===labels.length-1?'end':'middle')}" font-size="11" fill="var(--ink-3)">${l}</text>`;
    }
  });
  series.forEach((s,si)=>{
    const pts=s.values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    if(area&&si===0){
      g+=`<polygon points="${padL},${(padT+ih).toFixed(1)} ${pts} ${w-padR},${(padT+ih).toFixed(1)}" fill="${s.color}" fill-opacity=".10"/>`;
    }
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    if(s.dots!==false){
      s.values.forEach((v,i)=>{g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="var(--surface)" stroke="${s.color}" stroke-width="1.7"><title>${s.name||''} ${labels[i]}: ${fmt(v)}</title></circle>`;});
    }
  });
  if(tip){
    const si=tip.series||0, x=X(tip.i), y=Y(series[si].values[tip.i]);
    g+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${(padT+ih).toFixed(1)}" stroke="var(--border-strong)" stroke-dasharray="3 3"/>`;
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.8" fill="${series[si].color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  const tx=tip&&tip.i>=labels.length-1?'translate(-100%,-118%)':'translate(-50%,-118%)';
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${series.map(s=>s.name).join(' and ')}, ${labels[0]} to ${labels[labels.length-1]}, latest ${fmt(series[0].values[series[0].values.length-1])}">${g}</svg>${tip?`<div class="tip" style="left:${(X(tip.i)/w*100).toFixed(2)}%;top:${(Y(series[tip.series||0].values[tip.i])/h*100).toFixed(2)}%;transform:${tx}">${tip.text}</div>`:''}</div>`;
}
function barChart({labels,groups,w=336,h=148,yMax=null,fmt=v=>v,line=null,tip=null,padL=34,padR=8,padT=12,padB=20,ticks=4}){
  yMax = yMax ?? niceMax(Math.max(...groups.flatMap(g=>g.values),...(line?line.values:[0]))*1.12);
  const iw=w-padL-padR, ih=h-padT-padB;
  const Y=v=>padT+ih-(v/yMax)*ih;
  const gw=iw/labels.length, bw=Math.min(15,(gw*0.52)/groups.length);
  let g='';
  const nT=(yMax%4===0)?4:5;
  for(let i=0;i<=nT;i++){
    const v=yMax*i/nT, y=Y(v);
    g+=`<line x1="${padL}" x2="${w-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity="${i===0?.9:.6}"/>`;
    g+=`<text x="${padL-6}" y="${(y+3.2).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  labels.forEach((l,i)=>{
    const cx=padL+gw*i+gw/2;
    g+=`<text x="${cx.toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${l}</text>`;
    groups.forEach((gr,gi)=>{
      const x=cx-(groups.length*bw)/2+gi*bw+1, y=Y(gr.values[i]);
      g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(1,(padT+ih-y)).toFixed(1)}" rx="2.5" fill="${gr.color}"><title>${gr.name} ${l}: ${fmt(gr.values[i])}</title></rect>`;
    });
  });
  if(line){
    const pts=line.values.map((v,i)=>`${(padL+gw*i+gw/2).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${line.color}" stroke-width="2" stroke-dasharray="${line.dash||''}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  if(tip){
    const cx=padL+gw*tip.i+gw/2, y=Y(tip.v);
    g+=`<circle cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" r="3.8" fill="${tip.color||'var(--primary)'}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  const tx=tip&&tip.i>=labels.length-1?'translate(-100%,-118%)':'translate(-50%,-118%)';
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${groups.map(g=>g.name).join(' and ')}, ${labels[0]} to ${labels[labels.length-1]}, latest ${fmt(groups[0].values[groups[0].values.length-1])}">${g}</svg>${tip?`<div class="tip" style="left:${((padL+gw*tip.i+gw/2)/w*100).toFixed(2)}%;top:${(Y(tip.v)/h*100).toFixed(2)}%;transform:${tx}">${tip.text}</div>`:''}</div>`;
}
function spark(values,color='var(--primary)',w=68,h=24){
  const min=Math.min(...values),max=Math.max(...values);
  const X=i=>(i/(values.length-1))*(w-2)+1;
  const Y=v=>h-3-((v-min)/((max-min)||1))*(h-6);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

const APPS={phone:document.getElementById('app-phone'),pad:document.getElementById('app-pad')};
function currentApp(screen){
  if(app.role==='client')return 'client';
  if(['dataentry','import'].includes(screen)&&app.role==='admin')return 'doc';
  return ['overview','financial','cashflow','kpis','projects','project','tasks','settings','dataentry','import'].includes(screen)?'client':'doc';
}
const TAB_OF={
  home:'home',catalog:'catalog',doc:'catalog',plans:'catalog',checkout:'catalog',success:'library',library:'library',viewer:'library',updates:'updates',account:'account',admin:'account',documents:'account',users:'account',
  overview:'overview',financial:'overview',cashflow:'overview',kpis:'kpis',projects:'projects',project:'projects',tasks:'tasks',settings:'settings',dataentry:'account',import:'account',workspace:'home'
};
function activeSide(screen){
  if(screen==='doc'||screen==='plans')return 'catalog';
  if(screen==='success'||screen==='viewer')return 'library';
  if(screen==='project')return 'projects';
  return screen;
}
function afterRender(dev){
  APPS[dev]?.querySelectorAll('.card-h h4').forEach(h=>{h.setAttribute('role','heading');h.setAttribute('aria-level','2')});
  const sheet=APPS[dev]?.querySelector('.sheet');
  if(!sheet)return;
  if(!sheet.getAttribute('aria-label'))sheet.setAttribute('aria-label',sheet.querySelector('h3')?.textContent||'Dialog');
  if(!sheet.contains(document.activeElement)){const f=sheet.querySelector('button:not([disabled]),input,select,textarea');if(f)f.focus();else{sheet.tabIndex=-1;sheet.focus();}}
}
const ROLE_SCREENS={customer:['home','catalog','doc','plans','checkout','success','library','viewer','updates','account'],client:['overview','financial','cashflow','kpis','projects','project','tasks','settings','account'],staff:['home','catalog','doc','plans','checkout','success','library','viewer','updates','account','documents']};
const roleHome=()=>app.role==='client'?'overview':app.role==='admin'?'workspace':'home';
const allowScreen=scr=>app.role==='admin'||(ROLE_SCREENS[app.role]||[]).includes(scr);
function renderDevice(dev){
  try{
    if(!app.signedIn){
      APPS[dev].innerHTML=authScreen(dev);afterRender(dev);
      return;
    }
    if(nav[dev].screen!=='workspace'&&(!SCREENS[nav[dev].screen]||!allowScreen(nav[dev].screen))){nav[dev]={screen:roleHome(),params:{},stack:[]};ui[dev].sheet=null;}
    if(nav[dev].screen==='workspace'){
      APPS[dev].innerHTML=workspaceScreen(dev);afterRender(dev);
      return;
    }
    const prevScreen=APPS[dev].dataset.screen;
    const prevScroll=prevScreen===nav[dev].screen?APPS[dev].querySelector('.content,.pad-content')?.scrollTop||0:0;
    const def=SCREENS[nav[dev].screen](dev);
    if(dev==='phone'){
      APPS[dev].innerHTML=phoneShell({...def,tab:def.tab||TAB_OF[nav[dev].screen]||'home',appName:def.appName||currentApp(nav[dev].screen),sheet:sheetHTML(dev)});
    }else{
      APPS[dev].innerHTML=padShell({...def,active:def.active||activeSide(nav[dev].screen),appName:def.appName||currentApp(nav[dev].screen),sheet:sheetHTML(dev)});
    }
    const scroller=APPS[dev].querySelector('.content,.pad-content');if(scroller&&prevScroll)scroller.scrollTop=prevScroll;
    APPS[dev].dataset.screen=nav[dev].screen;
    afterRender(dev);
  }catch(err){
    console.error('render error',err);
    APPS[dev].innerHTML=`<div style="padding:24px;font:12px ui-monospace,monospace;color:var(--neg);white-space:pre-wrap"><b>Render error</b><br>${esc(err.message)}<br><br>${esc(err.stack||'')}</div>`;
  }
}
function renderAll(){renderDevice('phone');renderDevice('pad')}
function go(dev,screen,params={},opts={}){
  const n=nav[dev];
  if(n.screen==='import'&&screen!=='import')app.csvStep=1;
  if(opts.root){n.stack=[]}
  else if(n.screen&&n.screen!==screen){n.stack.push({screen:n.screen,params:n.params})}
  n.screen=screen;n.params=params;ui[dev].sheet=null;
  renderDevice(dev);
  if(dev==='pad'&&screen==='workspace')renderAll();
  pushHist();
}
function goBoth(screen,params={}){
  ['phone','pad'].forEach(d=>{nav[d]={screen,params:{...params},stack:[]};ui[d].sheet=null;});
  renderAll();
  pushHist();
}
function back(dev){
  const n=nav[dev],prev=n.stack.pop();
  if(prev){n.screen=prev.screen;n.params=prev.params;ui[dev].sheet=null;renderDevice(dev)}
  else{go(dev,roleHome(),{},{root:true})}
  try{history.replaceState(histState(),'')}catch(e){}
}
function toast(dev,msg){
  app.toast[dev]={msg,until:Date.now()+2400};
  renderDevice(dev);
  setTimeout(()=>{
    if(app.toast[dev]&&app.toast[dev].until<=Date.now()){
      app.toast[dev]=null;
      const el=APPS[dev]?.querySelector('.toast');
      if(el)el.remove();
    }
  },2500);
}
function setTheme(t){
  app.theme=t;document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===t));
}
function setView(v){
  app.view=v;
  document.querySelectorAll('#devSeg button').forEach(b=>b.classList.toggle('on',b.dataset.dev===v));
  document.querySelector('[data-slot="phone"]').classList.toggle('hidden',v==='pad');
  document.querySelector('[data-slot="pad"]').classList.toggle('hidden',v==='phone');
  document.getElementById('rotateBtn').hidden=v!=='pad';
  document.getElementById('rotateBtn2').hidden=v!=='pad';
  fitStage();
}
function fitStage(){
  const stage=document.getElementById('stage');
  const bar=document.querySelector('.demo-bar').offsetHeight;
  const landscape=app.ipadLandscape;
  const pw=393, ph=852;
  const iw=landscape?1180:820, ih=landscape?820:1180;
  const gap=app.view==='both'?44:0;
  const totalW=app.view==='both'?pw+gap+iw:app.view==='pad'?iw:pw;
  const totalH=app.view==='pad'?ih:app.view==='both'?Math.max(ph,ih):ph;
  const availW=Math.max(320,stage.clientWidth-24);
  const availH=Math.max(320,window.innerHeight-bar-86);
  const fit=Math.min(availW/totalW,availH/totalH,app.view==='both'?.82:1);
  document.documentElement.style.setProperty('--fit',Math.max(.36,fit).toFixed(3));
}
function applyRoleNav(role){
  const first=role==='client'?'overview':'home';
  ['phone','pad'].forEach(d=>{nav[d]={screen:app.signedIn?(role==='admin'?'workspace':first):'signin',params:{},stack:[]};ui[d].sheet=null;});
  renderAll();
}

const entryFor=id=>app.entries[id]||(app.entries[id]={rev:'',lab:'',food:'',other:'',notes:''});
function entryValues(dev){
  const root=document.querySelector(`[data-device="${dev}"]`);
  const draft=entryFor(app.entryClient);
  const q=k=>Number((root?.querySelector(`[data-entry="${k}"]`)?.value||draft[k]||'0').replace(/[^0-9.]/g,''))||0;
  return {rev:q('rev'),lab:q('lab'),food:q('food'),other:q('other')};
}
function entryCalc(v){
  const profit=v.rev-v.lab-v.food-v.other;
  const margin=v.rev?profit/v.rev*100:0;
  return {profit,margin};
}
function applyPublished(v,c){
  const o=CLIENT_DATA.Oct, prior=(FIN_PRIOR[9]||175.9)*1000;
  const labour=v.lab/v.rev*100, food=v.food/v.rev*100;
  const sign=n=>(n>=0?'+':'')+n.toFixed(1);
  o.rev=money(v.rev);o.revD=sign((v.rev-prior)/prior*100)+'%';
  o.margin=c.margin.toFixed(1)+'%';
  const sep=parseFloat(CLIENT_DATA.Sep.margin)||18.3;
  o.marginD=sign(c.margin-sep)+' pt';
  o.labour=labour.toFixed(1)+'%';o.labourD=sign(labour-32)+' pt';
  o.food=food.toFixed(1)+'%';
  const r=KPI_ROWS;
  r[0].v='A$'+(v.rev/1000).toFixed(1)+'k';r[0].status=v.rev>=180000?'On track':'Watch';
  r[1].v=o.margin;r[1].status=c.margin>=16?'On track':'Watch';
  r[2].v=o.labour;r[2].status=labour<=32?'On track':'Watch';
  r[3].v=o.food;r[3].status=food<=28.2?'On track':'Watch';
}

    ${app.entryPublished?`<div class="banner" style="margin-top:var(--s-2)">${icon('checkCircle',15)}<span class="grow">Published to ${CLIENTS.find(c=>c.id===app.entryClient)?.n||CLIENT.name}</span></div>`:''}

  const downloads=live?`<div class="card"><div class="card-h"><h4>Downloads</h4><span class="sub">Wi-Fi only</span></div><div class="between t-12"><span class="muted">Downloaded</span><span class="strong">${library.filter(e=>e.status==='downloaded').length} ${library.filter(e=>e.status==='downloaded').length===1?'document':'documents'}</span></div><div class="between t-12" style="margin-top:var(--s-2)"><span class="muted">Updates queued</span><span class="strong">${library.filter(e=>e.status==='update').length}</span></div><div class="between t-12" style="margin-top:var(--s-2)"><span class="muted">Storage</span><span class="strong">2.4 GB of 5.6 GB</span></div><div style="margin-top:var(--s-2)">${C.bar(43)}</div></div>`:'';
  const padding='';
  if(pad){
    const head=padHead('Library',counts,live?`<button class="btn outline sm" data-act="download-all">${icon('download',15)}Download all</button>`:'');
    if(app.dataState!=='live'){
      return {header:head,body:`<div class="between"><span class="privacy">${icon('lock',13)}Only you can see this data</span><span class="t-11 faint">3.2 GB available</span></div>${libraryRows(dev)}`};
    }
    const sel=libEntry(app.libSelected)||library[0];
    const sd=docById(sel.id);
    const detail=`<div class="stack" style="gap:12px">
      <div class="card"><div class="row" style="gap:12px;align-items:flex-start">${C.cover(sd,96,120,true,true)}<div class="grow"><div class="label">${sd.cat}</div><div class="t-15 strong" style="margin-top:var(--s-1);line-height:1.2">${sd.t}</div><div class="row" style="gap:var(--s-1);margin-top:var(--s-2)">${sel.status==='update'?C.chip('Version '+sel.newVersion.replace(/^v/,''),'warn'):C.chip(sel.version,'pos',true)}${C.chip(sel.size,'neutral')}</div><div class="t-11 faint" style="margin-top:var(--s-2)">${sel.status==='update'?'Version '+sel.newVersion.replace(/^v/,'')+' ready to install':sel.status==='downloading'?'Downloading '+Math.round(sel.progress)+'%':'Downloaded to this iPad'}</div></div></div>
        ${sel.status==='downloading'?`<div style="margin-top:var(--s-2)">${C.bar(sel.progress)}</div>`:''}
        <div class="row" style="gap:var(--s-2);margin-top:var(--s-3)">${sel.status==='update'?`<button class="btn primary sm" data-act="update-entry" data-id="${sel.id}">Update</button>`:`<button class="btn primary sm" data-act="open-viewer" data-id="${sel.id}">${icon('eye',14)}Open</button>`}<button class="btn sm outline" data-act="download-entry" data-id="${sel.id}">${icon('download',14)}${sel.status==='downloading'?'Cancel':'Download'}</button></div>
      </div>
      <div class="card"><div class="card-h"><h4>Version history</h4>${C.chip('2 this year','neutral')}</div><table class="tbl"><thead><tr><th scope="col">Version</th><th scope="col">Published</th></tr></thead><tbody><tr><td><b>${sel.version}</b></td><td class="muted">${sd.upd}</td></tr><tr><td>${prevVersion(sel.version)}</td><td class="muted">3 months earlier</td></tr></tbody></table></div>
      <div class="banner">${icon('lock',15)}<span class="grow">Links expire after 72 hours. Downloads are watermarked.</span></div>
    </div>`;
    return {header:head,body:`<div class="lib-grid" style="flex:1"><div class="stack" style="gap:var(--s-2)">${tabs}${libraryRows(dev)}</div>${detail}</div>`};
  }
  return {header:lgHead('Library',counts,live?`<button class="icon-btn" data-act="download-all" aria-label="Download all">${icon('download',20)}</button>`:''),body:`${tabs}${padding}${libraryRows(dev)}${downloads}<div class="between" style="margin-top:auto"><span class="t-11 faint">3.2 GB available on this iPhone</span><button class="t-11 strong tap" style="color:var(--primary)" data-act="manage-storage">Manage storage</button></div>`,tab:'library'};
}

/* ============================================================
   ACTIONS
   ============================================================ */
function addLibrary(id){
  if(libEntry(id))return;
  library.push({id,version:docById(id).v,status:'downloading',progress:0,size:'—'});
}
function setDownload(id){
  const e=libEntry(id);
  if(!e){library.push({id,version:docById(id).v,status:'downloading',progress:4,size:'—'});return}
  if(e.status==='update'&&e.newVersion)e.targetVersion=e.newVersion;
  e.status='downloading';e.progress=4;
}
function startCheckout(dev,kind,id){
  const item=kind==='doc'?docById(id):BUNDLES.find(b=>b.id===id);
  if(!item)return;
  app.cart={kind,id,title:item.t,price:item.price,meta:kind==='doc'?item.v+' · one-time purchase':item.v+' · bundle'};
  go(dev,'checkout');
}
function processPayment(dev){
  if(!app.cart)return;
  const root=document.querySelector(`[data-device="${dev}"]`);
  const email=(root?.querySelector('#receipt-'+dev)?.value||roleEmail()).trim();
  ui[dev].sheet={type:'processing'};renderDevice(dev);
  const c={...app.cart};
  setTimeout(()=>{
    if(c.kind==='doc')addLibrary(c.id);
    else if(c.kind==='bundle'){const b=BUNDLES.find(x=>x.id===c.id);if(b)b.items.forEach(addLibrary)}
    app.orderSeq=app.orderSeq||2043;
    const order='A-'+(app.orderSeq++);
    app.lastPurchase={kind:c.kind,id:c.id,title:c.title,price:c.price,order,email};
    const receipt=app.updates.find(n=>n.id==='n3');if(receipt){receipt.title='Receipt for order #'+order;receipt.body=money2(c.price)+' · 17 Nov 2026'}
    app.cart=null;ui[dev].sheet=null;
    nav[dev]={screen:'success',params:{},stack:[]};
    renderDevice(dev);
    pushHist();
    toast(dev,'Payment approved');
  },1100);
}
function subscribe(dev){
  app.subscribed=true;
  DOCS.forEach(d=>{if(!libEntry(d.id))library.push({id:d.id,version:d.v,status:'downloading',progress:0,size:'—'})});
  app.orderSeq=app.orderSeq||2043;
  app.renewsOn=Date.now()+(app.billing==='annual'?365:30)*86400000;
  app.lastPurchase={kind:'plan',title:'AmiWho Pro',price:app.billing==='annual'?PLANS.annual:PLANS.monthly,order:'A-'+(app.orderSeq++),email:roleEmail()};
  nav[dev]={screen:'success',params:{},stack:[]};
  renderDevice(dev);
  pushHist();
  toast(dev,'AmiWho Pro is active');
}
function downloadPurchase(dev){
  const p=app.lastPurchase;if(!p)return;
  if(p.kind==='doc')setDownload(p.id);
  else if(p.kind==='bundle'){const b=BUNDLES.find(x=>x.id===p.id);if(b)b.items.forEach(setDownload)}
  else{DOCS.forEach(d=>setDownload(d.id));library.forEach(e=>{if(e.status==='update')setDownload(e.id)})}
  go(dev,'library');
}
function completeSignIn(){
  app.signedIn=true;app.authError='';
  applyRoleNav(app.role);
}
function signIn(dev){
  const email=document.getElementById('email-'+dev)?.value.trim();
  const pass=document.getElementById('pass-'+dev)?.value;
  if(!email||!pass){app.authError='Enter your email and password.';renderDevice(dev);return}
  app.authError='';completeSignIn();
}
function signOut(){
  app.signedIn=false;app.cart=null;app.authError='';
  ['phone','pad'].forEach(d=>{nav[d]={screen:'signin',params:{},stack:[]};ui[d].sheet=null});
  renderAll();
}
function setDataState(v){
  app.dataState=v;
  renderAll();
}
function refreshCatalog(dev){
  const el=document.getElementById('cat-list-'+dev);
  if(el)el.innerHTML=catalogItems(dev);
  const c=document.getElementById('cat-count-'+dev);
  const n=visibleDocs().length;
  if(c)c.textContent=n+' document'+(n===1?'':'s');
}
function updateEntryCalc(dev){
  const root=document.querySelector(`[data-device="${dev}"]`);
  if(!root)return;
  const v=entryValues(dev),c=entryCalc(v);
  const m=root.querySelector('.calc-margin');if(m)m.textContent=c.margin.toFixed(1)+'%';
  const p=root.querySelector('.calc-profit');if(p)p.textContent=money(c.profit);
}
function toggleRotate(){
  app.ipadLandscape=!app.ipadLandscape;
  const pad=document.querySelector('[data-device="pad"]');
  pad.classList.toggle('landscape',app.ipadLandscape);
  const size=document.getElementById('padSize');
  if(size)size.textContent=app.ipadLandscape?'1180 × 820':'820 × 1180';
  renderDevice('pad');
  fitStage();
}
function closeSheet(dev){if(dev){ui[dev].sheet=null;renderDevice(dev)}}

      case 'compare': app.compare=!app.compare;renderDevice(d);break;
      case 'dataentry': if(app.role==='admin')go(d,'dataentry');else toast(d,'Admin only');break;
      case 'import': if(app.role==='admin')go(d,'import');else toast(d,'Admin only');break;
    }
  }catch(err){console.error(err)}
});

  if(e.key!=='Enter')return;
  const t=e.target;if(!t.matches('input,select,textarea'))return;
  const root=t.closest('[data-device]');if(!root)return;
  const submit=root.querySelector('[data-act="signin"]')||root.querySelector('[data-act="add-task"]');

document.addEventListener('keydown',e=>{
  const open=['phone','pad'].find(d=>ui[d].sheet);
  if(!open)return;
  if(e.key==='Escape'){ui[open].sheet=null;renderDevice(open);return;}
  if(e.key!=='Tab')return;
  const sheet=APPS[open].querySelector('.sheet');if(!sheet)return;
  const f=[...sheet.querySelectorAll('button:not([disabled]),[href],input,select,textarea')].filter(el=>!el.disabled);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

  let changed=false;
  library.forEach(en=>{
    if(en.status==='downloading'&&en.progress<100){
      en.progress=Math.min(100,en.progress+7);
      if(en.progress>=100){
        en.status='downloaded';
        if(en.targetVersion){en.version=en.targetVersion;delete en.targetVersion}
        delete en.newVersion;
      }
      changed=true;
    }
  });
  if(changed){['phone','pad'].forEach(d=>{if(['library','viewer'].includes(nav[d].screen)&&!ui[d].sheet)renderDevice(d)})}
},500);
setInterval(()=>{['phone','pad'].forEach(d=>{if(nav[d].screen==='viewer'&&app.signedIn)APPS[d].querySelectorAll('.expiry').forEach(el=>el.textContent=viewerTime())})},1000);

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('role')&&['customer','client','admin','staff'].includes(q.get('role'))){app.role=q.get('role');document.getElementById('roleSel').value=app.role}
  if(q.get('theme')==='dark')setTheme('dark');
  if(q.get('state')&&['live','empty','loading','error'].includes(q.get('state'))){app.dataState=q.get('state');document.getElementById('stateSel').value=app.dataState}
  if(q.get('landscape')==='1'){app.ipadLandscape=true;document.querySelector('[data-device="pad"]').classList.add('landscape');document.getElementById('padSize').textContent='1180 × 820'}
  if(q.get('view')&&['phone','pad','both'].includes(q.get('view')))setView(q.get('view'));
  if(q.get('in')==='1'){
    app.signedIn=true;
    const screen=q.get('screen')||(app.role==='client'?'overview':app.role==='admin'?'workspace':'home');
    const params=q.get('id')?{id:q.get('id')}:{};
    if(screen==='viewer')app.viewer={id:params.id||'labour',page:1,expiry:Date.now()+598000};
    ['phone','pad'].forEach(d=>{nav[d]={screen,params:{...params},stack:[]}});
  }
  fitStage();
  renderAll();
  try{history.replaceState(histState(),'')}catch(e){}
})();
window.addEventListener('popstate',e=>{
  if(!e.state||!e.state.phone)return;
  nav.phone=e.state.phone;nav.pad=e.state.pad||nav.pad;
  ui.phone.sheet=null;ui.pad.sheet=null;
  renderAll();
});
</script>
