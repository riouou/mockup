/* ============================================================
   AMIWHO BRAND SYSTEM
   Direction: AMIwho hospitality consultancy, in-house ledger.
   Type: Dark Paradise uppercase for mastheads (-0.02em);
         Work Sans for interface, labels and figures.
   Scale: 11 / 13 / 15 / 17 / 20 / 24 / 30.
   Space: 4px scale. Radii: stamp 2, control 3, button 4, sheet 8.
   Colour: charcoal #232222, champagne #DDC6A5, cream #F4E6CA,
           off-white #EEECEA; antique gold #A57C3F as the accent.
   Signature: double gold rule over mastheads, AW oval mark,
              book-spine document covers, black marble auth panel.
   Elevation: hairline borders; shadows only on the device and sheets.
   ============================================================ */
:root{
  --font-sans:"Work Sans","Segoe UI",system-ui,sans-serif;
  --font-serif:"Dark Paradise",Georgia,"Times New Roman",serif;

  --text-2xs:11px; --text-xs:13px; --text-sm:13px; --text-base:15px; --text-md:17px; --text-lg:20px; --text-xl:24px; --text-2xl:30px;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px;

  --r-stamp:2px; --r-sm:3px; --r-control:3px; --r-btn:4px; --r-card:2px; --r-pill:999px; --r-sheet:8px; --r-device:56px; --r-tablet:38px;

  --e-1:none;
  --e-2:0 18px 48px rgba(30,28,18,.20);
  --device-edge:#C9C0AC;
  --e-device:0 0 0 1px var(--device-edge),0 2px 4px rgba(30,28,18,.10),0 40px 80px -40px rgba(30,28,18,.55);
  --dur:180ms; --dur-1:100ms; --dur-2:180ms; --dur-3:280ms; --dur-4:420ms; --ease-out:cubic-bezier(.22,.61,.36,1); --ease-in:cubic-bezier(.4,0,1,1); --ease-ios:cubic-bezier(.32,.72,0,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);

  --charcoal:#232222; --champagne:#DDC6A5; --cream:#F4E6CA; --offwhite:#EEECEA; --gold:#A57C3F;
  --stage:#171412; --stage-2:#211D1B; --line:#3A322B;
  --bg:#EEECEA; --surface:#FBFAF5; --surface-2:#F4E6CA; --surface-3:#E6D8C1;
  --border:#D9CBB8; --border-strong:#C6B49A; --border-control:#8A7D6C;
  --ink:#232222; --ink-2:#5A5450; --ink-3:#716A64;

  --primary:#232222; --primary-press:#000000; --primary-soft:#F1E4D0; --on-primary:#F4E6CA;
  --accent:#A57C3F;
  --pos:#2F6147; --pos-soft:#E4ECE2;
  --neg:#8A3A2E; --neg-soft:#F2DED9;
  --warn:#7A5A1F; --warn-soft:#F1E6CE;
  --info:#4A5B66; --info-soft:#E6ECEF;

  --chart-1:#232222; --chart-2:#A98C67; --chart-3:#A57C3F; --chart-4:#232222;

  --cover-teal:#5A3F2C; --cover-clay:#3A2721; --cover-sand:#6B4F2B; --cover-slate:#3A3F45; --cover-olive:#4A3B2B;
  --on-cover:#F4E6CA;

  --brand-deep:#232222; --on-brand:#F4E6CA; --on-brand-2:rgba(244,230,202,.78);
  --paper:#FBF7EF; --paper-soft:#F4E6CA; --paper-ink:#232222; --paper-2:#4A423C; --paper-3:#71675D; --paper-rule:#DDD0BC; --paper-accent:#232222;

  --device-black:#000; --on-danger:#FFFFFF; --switch-knob:#FFFDF7;
  --apple-bg:#000000; --apple-ink:#FFFFFF;
  --scrim:rgba(20,24,16,.42);
  --focus:#A57C3F;
  --fit:1;
}
[data-theme="dark"]{
  --stage:#0C0A09; --stage-2:#141110; --line:#2A2421;
  --bg:#12100F; --surface:#1A1716; --surface-2:#221D1A; --surface-3:#2A2420;
  --border:#332B26; --border-strong:#4A3F36; --border-control:#8A7B6A;
  --ink:#F3EDE3; --ink-2:#C4B9AC; --ink-3:#A69A8D;

  --primary:#F4E6CA; --primary-press:#FFF6E8; --primary-soft:#2B241D; --on-primary:#232222;
  --accent:#D8B987;
  --pos:#7FBE9A; --pos-soft:#17291F;
  --neg:#E39A8B; --neg-soft:#341A16;
  --warn:#D8B36A; --warn-soft:#2C2413;
  --info:#A9BEC9; --info-soft:#18252B;

  --chart-1:#F4E6CA; --chart-2:#C0A17C; --chart-3:#D8B987; --chart-4:#F3EDE3;

  --device-edge:#2B2521;
  --e-1:none;
  --e-2:0 18px 48px rgba(0,0,0,.60);
  --e-device:0 0 0 1px var(--device-edge),0 2px 4px rgba(0,0,0,.50),0 40px 80px -30px rgba(0,0,0,.85);
  --on-danger:#1A0F0C; --switch-knob:#EFEADC;
  --apple-bg:#FFFFFF; --apple-ink:#000000;
  --scrim:rgba(0,0,0,.60);
  --focus:#D8B987;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;min-height:100dvh;background:var(--stage);color:var(--ink);font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,[data-act],.tab,.side-item,.fchip,.list .item,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,[data-act]{-webkit-user-select:none;user-select:none}
input,textarea,select,.doc-page,.doc-page *{user-select:text}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
input,select,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ============================================================
   DEMO CHROME
   ============================================================ */
.demo-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:var(--s-4);padding:var(--s-2) var(--s-5);background:var(--stage);border-bottom:1px solid rgba(221,198,165,.22);color:var(--cream);flex-wrap:wrap}
.db-controls{margin-left:auto;display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl span{font-size:var(--text-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--champagne)}
.ctl select option{background:#1E1A18;color:var(--cream)}
.ctl select{background:#1E1A18;border:1px solid rgba(221,198,165,.32);border-radius:var(--r-sm);height:32px;padding:0 var(--s-2);font-size:var(--text-xs);font-weight:500;color:var(--cream);cursor:pointer}
.seg{display:flex;gap:2px;background:#1E1A18;border-radius:var(--r-control);padding:2px;border:1px solid rgba(221,198,165,.24)}
.seg button{height:28px;padding:0 var(--s-2);border-radius:var(--r-sm);font-size:var(--text-xs);font-weight:600;color:rgba(244,230,202,.64);white-space:nowrap}
.seg button.on{background:#2A2522;color:var(--cream);box-shadow:inset 0 -2px 0 var(--champagne)}
.db-btn{display:inline-flex;align-items:center;gap:var(--s-1);height:32px;padding:0 var(--s-2);border-radius:var(--r-sm);border:1px solid rgba(221,198,165,.32);background:transparent;font-size:var(--text-xs);font-weight:600;color:var(--cream)}
.db-btn:hover{color:var(--ink)}
.db-sep{width:1px;height:24px;background:rgba(221,198,165,.24)}
.stage{display:flex;justify-content:center;align-items:flex-start;gap:var(--s-10);padding:var(--s-6) var(--s-6) var(--s-10);min-height:calc(100vh - 106px)}
.slot{display:flex;flex-direction:column;gap:var(--s-2);flex:none;zoom:var(--fit);transform-origin:top center}
.slot.hidden{display:none}
.slot-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);padding:0 var(--s-1);min-height:20px}
.slot-head .lbl{font-size:var(--text-2xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--champagne);white-space:nowrap}
.slot-head .lbl b{color:var(--cream);font-weight:600;text-transform:none;letter-spacing:0;font-size:var(--text-2xs);margin-left:6px}
.slot-head .rot{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--text-2xs);font-weight:600;color:var(--champagne);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);height:44px;padding:0 var(--s-4);border-radius:var(--r-btn);font-size:var(--text-base);font-weight:600;letter-spacing:-.005em;white-space:nowrap;flex:none;transition:background-color var(--dur) ease,color var(--dur) ease,border-color var(--dur) ease}

.seg2.pill{background:transparent;padding:0;gap:var(--s-2);border-radius:0}
.seg2.pill button{min-height:44px;border:1px solid var(--border-control);border-radius:var(--r-sm);padding:var(--s-3) var(--s-3);font-size:var(--text-xs);flex:none;background:var(--surface)}
.seg2.pill button.on{background:var(--surface);color:var(--ink);border-color:var(--border-strong);box-shadow:inset 0 -2px 0 var(--accent)}

.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.list .item{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-top:1px solid var(--border);min-height:48px;width:100%;text-align:left;color:inherit}
.list .item:first-child{border-top:0}
.list .item:hover{background:var(--surface-2)}
.list .item .t1{font-size:var(--text-base);font-weight:500;letter-spacing:-.005em;line-height:1.25}
.list .item .t2{font-size:var(--text-xs);color:var(--ink-3);margin-top:var(--s-1);line-height:1.35;overflow-wrap:anywhere}
.chev{color:var(--ink-3);flex:none}
.avatar{width:36px;height:36px;border-radius:var(--r-pill);display:grid;place-items:center;font-size:var(--text-2xs);font-weight:600;background:var(--primary-soft);color:var(--primary);flex:none}
.avatar.sm{width:28px;height:28px;font-size:var(--text-2xs)}
.avatar.lg{width:54px;height:54px;font-size:var(--text-md)}
.lg-head .avatar,.pad-head .avatar{width:44px;height:44px;font-size:var(--text-xs)}
.avatar.a2{background:var(--warn-soft);color:var(--warn)}
.avatar.a3{background:var(--neg-soft);color:var(--neg)}
.avatar.a4{background:var(--surface-3);color:var(--ink-2)}

.cover{position:relative;border-radius:var(--r-card);overflow:hidden;color:var(--on-cover);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s-3);flex:none;border:0;background:var(--cover-teal)}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(0,0,0,.22)}
.cover.t-teal{background:var(--cover-teal)}
.cover.t-clay{background:var(--cover-clay)}
.cover.t-sand{background:var(--cover-sand)}
.cover.t-slate{background:var(--cover-slate)}
.cover.t-olive{background:var(--cover-olive)}
.cover .cover-text{margin-top:auto}
.cover .mono{font-family:var(--font-serif);font-size:var(--text-lg);font-weight:600;line-height:1;opacity:.95}
.cover .cat{font-size:var(--text-2xs);font-weight:700;letter-spacing:.13em;text-transform:uppercase;opacity:.82}
.pad .cover:not(.sm):not(.mini) .ttl{font-size:var(--text-base)}
.cover .ttl{font-family:var(--font-serif);font-size:var(--text-xs);font-weight:600;line-height:1.2;letter-spacing:0}
.cover .ver{font-size:var(--text-2xs);opacity:.78;margin-top:var(--s-1)}
.cover.sm,.cover.mini{display:grid;place-items:center;justify-content:center;align-content:center;padding:0}
.cover.sm .mono,.cover.mini .mono{font-size:var(--text-base)}
.cover.sm .cover-text,.cover.mini .cover-text{display:none}
.cover:not(.sm):not(.mini) .mono{display:none}

.featured{background:var(--charcoal);border-color:rgba(221,198,165,.34);color:var(--cream)}
.featured .label{color:var(--champagne)}
.featured .t-11,.featured .muted,.featured .faint{color:rgba(244,230,202,.72)}
.featured .chip.primary{color:var(--champagne);border-color:rgba(221,198,165,.55)}
.featured .cover{border:1px solid rgba(221,198,165,.34)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.kpis.three{grid-template-columns:repeat(3,1fr)}
.kpis.four{grid-template-columns:repeat(4,1fr)}
.pad:not(.landscape) .kpis.four{grid-template-columns:1fr 1fr}
.kpi{background:transparent;border:0;border-top:1px solid var(--border);border-radius:0;padding:var(--s-2) 0 var(--s-1);min-width:0}
.kpi .lbl{font-size:var(--text-2xs);font-weight:600;letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:center;gap:var(--s-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-size:var(--text-xl);font-weight:600;letter-spacing:-.02em;margin-top:var(--s-1);font-variant-numeric:tabular-nums}
.kpi .foot{display:flex;align-items:center;gap:var(--s-1);margin-top:var(--s-1);font-size:var(--text-2xs);font-weight:600;white-space:nowrap}
.kpi .foot .vs{color:var(--ink-3);font-weight:400}
.up{color:var(--pos)}.down{color:var(--neg)}
.bar{height:5px;border-radius:0;background:var(--surface-3);overflow:hidden}
.bar i{display:block;width:100%;height:100%;border-radius:0;background:var(--primary);transform-origin:left;transform:scaleX(var(--p,1));transition:transform var(--dur-2) var(--ease-out)}
.bar.thin{height:4px}
.bar.warn i{background:var(--warn)}
.bar.pos i{background:var(--pos)}

.chart{position:relative;min-width:0}
.chart svg{width:100%;height:auto;overflow:visible}
.legend{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;font-size:var(--text-2xs);color:var(--ink-2);margin-top:var(--s-2)}
.legend i{display:inline-block;width:8px;height:3px;border-radius:0;margin-right:5px}
.tip{position:absolute;transform:translate(-50%,-118%);background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);font-size:var(--text-2xs);font-weight:600;padding:4px 7px;border-radius:var(--r-stamp);white-space:nowrap;pointer-events:none;z-index:3;font-variant-numeric:tabular-nums}
.tip:after{display:none}
.spark{display:block}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:var(--text-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:var(--s-2);border-bottom:1px solid var(--border-strong);white-space:nowrap}
.tbl td{padding:var(--s-2);border-bottom:1px solid var(--border);font-size:var(--text-xs);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl.compact th{font-size:var(--text-2xs);padding:var(--s-1) 6px}
.tbl.compact td{font-size:var(--text-2xs);padding:var(--s-1) 6px}
.tbl.tight th,.tbl.tight td{padding-left:6px;padding-right:6px}
.tbl.tight td .avatar.sm{width:24px;height:24px;font-size:var(--text-2xs)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .muted{color:var(--ink-2)}
.tbl th.num{text-align:right}

.privacy{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--text-2xs);font-weight:600;letter-spacing:.04em;color:var(--ink-3);background:transparent;border:0;border-radius:0;padding:0;white-space:nowrap}
.privacy svg{color:var(--primary)}
.banner{display:flex;align-items:center;gap:var(--s-2);border-radius:0;border:0;border-left:3px solid var(--accent);padding:var(--s-2) var(--s-3);font-size:var(--text-xs);font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.banner.warn{background:var(--warn-soft);color:var(--ink);border-left-color:var(--warn)}
.banner.neg{background:var(--neg-soft);color:var(--ink);border-left-color:var(--neg)}
.banner .grow{font-weight:500}

/* auth */
.auth{flex:1;display:flex;flex-direction:column;padding:var(--s-1) var(--s-6) var(--s-6);min-height:0;overflow-y:auto;scrollbar-width:none}
.auth::-webkit-scrollbar{display:none}
.wmark{display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-serif);font-weight:600;letter-spacing:-.01em;font-size:var(--text-md)}
.auth h1:before{content:"";display:block;width:32px;height:5px;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);margin-bottom:var(--s-3)}
.auth h1{font-family:var(--font-serif);font-size:var(--text-2xl);line-height:1.05;letter-spacing:-.02em;font-weight:600;text-transform:uppercase;margin-top:var(--s-6)}
.auth .lead{font-size:var(--text-base);line-height:1.5;color:var(--ink-2);margin-top:var(--s-2);max-width:36ch}
.auth .form{margin-top:var(--s-5);display:flex;flex-direction:column;gap:var(--s-3)}
.or{display:flex;align-items:center;gap:var(--s-2);font-size:var(--text-2xs);font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin:var(--s-1) 0}
.or:before,.or:after{content:"";height:1px;background:var(--border);flex:1}
.auth .fine{font-size:var(--text-xs);color:var(--ink-2);text-align:center;margin-top:var(--s-3)}
.link{color:var(--primary);font-weight:600;text-decoration:none}
.auth .spacer{margin-top:auto}
.auth-split{flex:1;display:grid;grid-template-columns:43% 1fr;min-height:0}

.auth-brand:before{content:"";position:absolute;inset:0;background:rgba(20,17,15,.60);z-index:0}
.auth-brand>*{position:relative;z-index:1}
.auth-brand .ab-logo{display:flex;align-items:center;gap:var(--s-3);font-family:var(--font-serif);font-size:var(--text-lg);font-weight:600;position:relative}
.auth-brand h2{font-family:var(--font-serif);font-size:var(--text-2xl);line-height:1.05;letter-spacing:-.02em;font-weight:600;text-transform:uppercase;margin-top:auto;position:relative;max-width:14ch}
.auth-brand p{font-size:var(--text-base);line-height:1.55;color:var(--on-brand-2);margin-top:var(--s-3);position:relative;max-width:34ch}
.auth-brand .ab-foot{display:flex;gap:var(--s-3);margin-top:var(--s-6);position:relative;font-size:var(--text-2xs);color:var(--on-brand-2)}
.auth-form{padding:44px 60px;display:flex;flex-direction:column;justify-content:center;gap:var(--s-3);min-width:0;overflow-y:auto;scrollbar-width:none}
.auth-form::-webkit-scrollbar{display:none}
.auth-form h3:before{content:"";display:block;width:32px;height:5px;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);margin-bottom:var(--s-3)}
.auth-form h3{font-family:var(--font-serif);font-size:var(--text-xl);letter-spacing:-.02em;font-weight:600;text-transform:uppercase}
.auth-form .sub{font-size:var(--text-xs);color:var(--ink-2);margin-bottom:var(--s-1)}

/* sheets */
.dim{position:absolute;inset:0;background:var(--scrim);z-index:60;animation:fade var(--dur-2) var(--ease-out);transition:opacity var(--dur-2) var(--ease-out)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border-radius:var(--r-sheet);padding:var(--s-2) var(--s-5) var(--s-5);z-index:61;box-shadow:var(--e-2);text-align:center;border:1px solid var(--border-strong);animation:sheet-up var(--dur-3) var(--ease-ios);transition:transform var(--dur-2) var(--ease-spring)}
.sheet.wide{left:16px;right:16px;text-align:left;padding:var(--s-4) 20px 18px}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 14px}
.sheet .sheet-ic{width:40px;height:40px;border-radius:0;background:transparent;color:var(--primary);display:grid;place-items:center;margin:0 auto var(--s-2)}
.sheet h3{font-size:var(--text-md);font-weight:600;letter-spacing:-.01em}
.sheet p{font-size:var(--text-xs);color:var(--ink-2);margin-top:var(--s-1);line-height:1.45}
.sheet .btn{margin-top:var(--s-3)}
.sheet .list{margin-top:var(--s-3);text-align:left}
@keyframes sheet-up{from{transform:translate3d(0,28px,0);opacity:.4}to{transform:none;opacity:1}}
.sheet.dragging{transition:none;will-change:transform}
.sheet .grab{position:relative;touch-action:none;cursor:grab}
.sheet .grab:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:32px}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* secure document paper: fixed white in both themes, like a PDF */
.doc-page{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-rule);border-radius:var(--r-control);padding:var(--s-5);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:360px}
.doc-page .doc-kicker{display:flex;justify-content:space-between;gap:var(--s-3);font-size:var(--text-2xs);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3)}
.doc-page h2{font-family:var(--font-serif);font-size:var(--text-lg);font-weight:600;letter-spacing:-.01em;margin-top:var(--s-4);color:var(--paper-ink)}
.doc-page p{font-size:var(--text-xs);line-height:1.65;color:var(--paper-2);margin-top:var(--s-2);max-width:72ch}
.doc-page .doc-sub{font-size:var(--text-xs);font-weight:600;color:var(--paper-accent);margin-top:var(--s-4)}
.doc-page table{width:100%;border-collapse:collapse;font-size:var(--text-2xs);color:var(--paper-2);margin-top:var(--s-2)}
.doc-page th{text-align:left;font-weight:600;padding:var(--s-1) 0;border-bottom:1px solid var(--paper-rule)}
.doc-page td{padding:var(--s-1) 0;border-bottom:1px solid var(--paper-rule)}
.doc-page tr:last-child td{border-bottom:0}
.doc-page .doc-foot{position:absolute;right:var(--s-4);bottom:var(--s-2);font-size:var(--text-2xs);color:var(--paper-3)}
.doc-page.lg{height:100%;min-height:0;padding:var(--s-6) var(--s-8)}
.doc-page.lg h2{font-size:var(--text-xl)}
.doc-page.lg p{font-size:var(--text-sm)}

/* misc */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s-2);padding:var(--s-8) var(--s-6);min-height:320px}
.empty .e-ic{width:28px;height:28px;border-radius:0;background:transparent;border:0;display:grid;place-items:center;color:var(--primary);margin-bottom:var(--s-1)}
.empty h3{font-family:var(--font-serif);font-size:var(--text-lg);font-weight:600;letter-spacing:-.01em}
.empty p{font-size:var(--text-sm);color:var(--ink-2);line-height:1.5;max-width:34ch}
.empty .btn{margin-top:var(--s-2)}
.skel{background:var(--surface-3);border-radius:var(--r-stamp);position:relative;overflow:hidden}
.skel:after{content:none}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:var(--text-xs);font-weight:600;padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);z-index:70;max-width:86%;text-align:center;pointer-events:auto;touch-action:none;cursor:grab;animation:toast-in var(--dur-3) var(--ease-ios);will-change:transform}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toast-out{to{opacity:0;transform:translate(-50%,12px)}}
.toast.out{animation:toast-out var(--dur-2) var(--ease-in) forwards}
.steps{display:flex;align-items:center;gap:var(--s-2)}
.step{display:flex;align-items:center;gap:var(--s-2);font-size:var(--text-2xs);font-weight:600;color:var(--ink-3);white-space:nowrap}
.step b{width:24px;height:24px;border-radius:var(--r-stamp);background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-size:var(--text-2xs);font-weight:700}
.step.done b{background:var(--pos-soft);color:var(--pos)}
.step.on{color:var(--ink)}
.step.on b{background:var(--primary);color:var(--on-primary)}
.step-line{height:1px;background:var(--border);flex:1;min-width:8px}
.dropzone{border:1px dashed var(--border-strong);border-radius:var(--r-card);padding:var(--s-5);text-align:center;background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.dropzone:hover{border-color:var(--primary)}
.dropzone .dz-ic{width:24px;height:24px;border-radius:0;background:transparent;color:var(--primary);display:grid;place-items:center;margin:0 auto var(--s-2)}
.acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);align-items:start}
.pad.landscape .acct-grid{grid-template-columns:1fr 1fr 1fr}
.only-landscape{display:none}
.pad.landscape .only-landscape{display:block}
.inset{border-top:1px solid var(--border);margin-top:var(--s-3);padding-top:var(--s-3)}
.note-ic{width:20px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.note-ic.pos{color:var(--pos)}
.note-ic.warn{color:var(--warn)}
.app-ic{width:20px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.success-ic{width:40px;height:40px;color:var(--pos);display:grid;place-items:center}
.success-ic svg{animation:check-pop var(--dur-3) var(--ease-spring)}
.e-ic.neg{color:var(--neg)}
.frames-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:var(--s-3);min-height:0;align-content:start}
.frames-grid > *{align-self:start}
.catalog-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.pad:not(.landscape) .catalog-grid{grid-template-columns:1fr}
.plans-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.lib-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--s-3);align-items:start;align-content:start}
.pad:not(.landscape) .lib-grid{grid-template-columns:1fr}
.pad:not(.landscape) .frames-grid{grid-template-columns:1fr}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-3)}
.pad.landscape .dash-grid>.span2{grid-column:span 2}
.pad:not(.landscape) .dash-grid>.span2{grid-column:auto}
button.switch{padding:0;border:0}
.pad:not(.landscape) .dash-grid{grid-template-columns:1fr}

@media (max-width:900px){
  .demo-bar{padding:8px 12px;gap:var(--s-2)}
  .db-controls{gap:var(--s-2)}
  .stage{padding:var(--s-4) 8px 24px;gap:20px;flex-wrap:wrap}
  .hint{padding:0 16px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.chart-line{stroke-dasharray:none!important;stroke-dashoffset:0!important}}
#app-phone .content{view-transition-name:phone-content}
#app-pad .pad-content{view-transition-name:pad-content}
::view-transition-old(root),::view-transition-new(root){animation:none}
html[data-vt="fade"]::view-transition-old(app-phone),html[data-vt="fade"]::view-transition-new(app-phone),html[data-vt="fade"]::view-transition-old(app-pad),html[data-vt="fade"]::view-transition-new(app-pad){animation-duration:var(--dur-2);animation-timing-function:var(--ease-out)}
</style>

<body>

<header class="demo-bar">
  <div class="db-controls">
    <div class="ctl"><span>Device</span>
      <div class="seg" id="devSeg">
        <button data-dev="phone">iPhone</button>
        <button data-dev="pad">iPad</button>
        <button data-dev="both" class="on">Both</button>
      </div>
    </div>
    <div class="ctl"><span>Appearance</span>
      <div class="seg" id="themeSeg">
        <button data-mode="light" class="on">Light</button>
        <button data-mode="dark">Dark</button>
      </div>
    </div>
    <label class="ctl"><span>Demo account</span>
      <select id="roleSel">
        <option value="customer">Customer · Alex</option>
        <option value="client">Client · Priya</option>
        <option value="admin">Admin · Sam</option>
        <option value="staff">Staff · Mira</option>
      </select>
    </label>
    <label class="ctl" title="Applies to Overview and Library"><span>Data state</span>
      <select id="stateSel">
        <option value="live">Live</option>
        <option value="empty">Empty</option>
        <option value="loading">Loading</option>
        <option value="error">Error</option>
      </select>
    </label>
    <div class="db-sep"></div>
    <button class="db-btn" data-act="rotate" id="rotateBtn" hidden>Rotate iPad</button>
    <button class="db-btn" data-act="signout">Sign out</button>
    <button class="db-btn" data-act="reset">Reset</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="slot" data-slot="phone">
    <div class="slot-head"><span class="lbl">iPhone 16 Pro <b>393 × 852</b></span><span class="lbl" id="phoneHint"></span></div>
    <div class="device phone" data-device="phone"><div class="app" id="app-phone"></div></div>
  </div>
  <div class="slot" data-slot="pad">
    <div class="slot-head"><span class="lbl">iPad Pro 11″ <b id="padSize">820 × 1180</b></span><button class="rot" data-act="rotate" id="rotateBtn2">Rotate</button></div>
    <div class="device pad" data-device="pad"><div class="app" id="app-pad"></div></div>
  </div>
</main>

<p class="hint"><b>Live prototype.</b> Sign in, browse, buy a document, download it, switch the workspace, edit a client, or import a CSV. Change <b>Data state</b> to see Library and Overview empty, loading and error states. <kbd>Sign in with Face ID</kbd> works too.</p>

function niceMax(v){
  if(!isFinite(v)||v<=0)return 1;
  const mag=Math.pow(10,Math.floor(Math.log10(v))), n=v/mag;
  const f=n<=1?1:n<=1.2?1.2:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10;
  return f*mag;
}
function lineChart({labels,series,w=336,h=148,yMin=0,yMax=null,fmt=v=>v,area=false,tip=null,padL=34,padR=8,padT=12,padB=20,ticks=4}){
  yMax = yMax ?? niceMax(Math.max(...series.flatMap(s=>s.values))*1.12);
  const iw=w-padL-padR, ih=h-padT-padB;
  const X=i=>padL+(labels.length===1?iw/2:(i/(labels.length-1))*iw);
  const Y=v=>padT+ih-((v-yMin)/(yMax-yMin))*ih;
  let g='';
  const nT=(yMax%4===0)?4:5;
  for(let i=0;i<=nT;i++){
    const v=yMin+(yMax-yMin)*i/nT, y=Y(v);
    g+=`<line x1="${padL}" x2="${w-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity="${i===0?.8:.35}"/>`;
    g+=`<text x="${padL-6}" y="${(y+3.2).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  const step=Math.ceil(labels.length/6);
  labels.forEach((l,i)=>{
    if(i%step===0||i===labels.length-1){
      g+=`<text x="${X(i).toFixed(1)}" y="${h-5}" text-anchor="${i===0?'start':(i===labels.length-1?'end':'middle')}" font-size="11" fill="var(--ink-3)">${l}</text>`;
    }
  });
  series.forEach((s,si)=>{
    const pts=s.values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    if(area&&si===0){
      g+=`<polygon points="${padL},${(padT+ih).toFixed(1)} ${pts} ${w-padR},${(padT+ih).toFixed(1)}" fill="${s.color}" fill-opacity=".08"/>`;
    }
    const draw=!s.dash?'class="chart-line" pathLength="1"':'';
    g+=`<polyline ${draw} points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    if(s.dots===true){
      s.values.forEach((v,i)=>{g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="var(--surface)" stroke="${s.color}" stroke-width="1.7"><title>${s.name||''} ${labels[i]}: ${fmt(v)}</title></circle>`;});
    }
  });
  if(tip){
    const si=tip.series||0, x=X(tip.i), y=Y(series[si].values[tip.i]);
    g+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${(padT+ih).toFixed(1)}" stroke="var(--border-strong)" stroke-dasharray="3 3"/>`;
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.8" fill="${series[si].color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  const tx=tip&&tip.i>=labels.length-1?'translate(-100%,-118%)':'translate(-50%,-118%)';
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${series.map(s=>s.name).join(' and ')}, ${labels[0]} to ${labels[labels.length-1]}, latest ${fmt(series[0].values[series[0].values.length-1])}">${g}</svg>${tip?`<div class="tip" style="left:${(X(tip.i)/w*100).toFixed(2)}%;top:${(Y(series[tip.series||0].values[tip.i])/h*100).toFixed(2)}%;transform:${tx}">${tip.text}</div>`:''}</div>`;
}
function barChart({labels,groups,w=336,h=148,yMax=null,fmt=v=>v,line=null,tip=null,padL=34,padR=8,padT=12,padB=20,ticks=4}){
  yMax = yMax ?? niceMax(Math.max(...groups.flatMap(g=>g.values),...(line?line.values:[0]))*1.12);
  const iw=w-padL-padR, ih=h-padT-padB;
  const Y=v=>padT+ih-(v/yMax)*ih;
  const gw=iw/labels.length, bw=Math.min(15,(gw*0.52)/groups.length);
  let g='';
  const nT=(yMax%4===0)?4:5;
  for(let i=0;i<=nT;i++){
    const v=yMax*i/nT, y=Y(v);
    g+=`<line x1="${padL}" x2="${w-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity="${i===0?.8:.35}"/>`;
    g+=`<text x="${padL-6}" y="${(y+3.2).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  labels.forEach((l,i)=>{
    const cx=padL+gw*i+gw/2;
    g+=`<text x="${cx.toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${l}</text>`;
    groups.forEach((gr,gi)=>{
      const x=cx-(groups.length*bw)/2+gi*bw+1, y=Y(gr.values[i]);
      g+=`<rect class="chart-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(1,(padT+ih-y)).toFixed(1)}" rx="0" fill="${gr.color}"><title>${gr.name} ${l}: ${fmt(gr.values[i])}</title></rect>`;
    });
  });
  if(line){
    const pts=line.values.map((v,i)=>`${(padL+gw*i+gw/2).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${line.color}" stroke-width="2" stroke-dasharray="${line.dash||''}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  if(tip){
    const cx=padL+gw*tip.i+gw/2, y=Y(tip.v);
    g+=`<circle cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" r="3.8" fill="${tip.color||'var(--primary)'}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  const tx=tip&&tip.i>=labels.length-1?'translate(-100%,-118%)':'translate(-50%,-118%)';
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${groups.map(g=>g.name).join(' and ')}, ${labels[0]} to ${labels[labels.length-1]}, latest ${fmt(groups[0].values[groups[0].values.length-1])}">${g}</svg>${tip?`<div class="tip" style="left:${((padL+gw*tip.i+gw/2)/w*100).toFixed(2)}%;top:${(Y(tip.v)/h*100).toFixed(2)}%;transform:${tx}">${tip.text}</div>`:''}</div>`;
}
function spark(values,color='var(--primary)',w=68,h=24){
  const min=Math.min(...values),max=Math.max(...values);
  const X=i=>(i/(values.length-1))*(w-2)+1;
  const Y=v=>h-3-((v-min)/((max-min)||1))*(h-6);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

const navMotion={phone:null,pad:null};

const prefersReduced=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateCounts(dev){
  if(prefersReduced())return;
  const screen=APPS[dev]?.dataset.screen;if(!screen)return;
  const els=[...APPS[dev].querySelectorAll('.kpi .val')];if(!els.length)return;
  if(countedScreens[dev].has(screen))return;
  countedScreens[dev].add(screen);
  els.forEach(el=>{
    const raw=el.textContent.trim();
    const m=raw.match(/^([^0-9-]*)(-?[0-9][0-9,]*(?:\.[0-9]+)?)(.*)$/);
    if(!m)return;
    const target=parseFloat(m[2].replace(/,/g,''));
    if(!isFinite(target))return;
    const decimals=(m[2].split('.')[1]||'').length;
    const start=performance.now(),dur=500;
    const fmt=n=>m[1]+n.toLocaleString('en-AU',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})+m[3];
    el.textContent=fmt(0);
    const tick=t=>{
      if(!el.isConnected)return;
      const p=Math.min(1,(t-start)/dur),eased=1-Math.pow(1-p,3);
      el.textContent=fmt(target*eased);
      if(p<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
function bindToast(dev){
  const el=APPS[dev]?.querySelector('.toast');if(!el||el.dataset.bound)return;
  el.dataset.bound='1';
  let sx=0,dx=0,active=false;
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    active=true;sx=e.clientX;dx=0;el.setPointerCapture(e.pointerId);el.style.animation='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!active)return;dx=e.clientX-sx;
    el.style.transform=`translate(calc(-50% + ${dx}px),0)`;
    el.style.opacity=String(Math.max(.25,1-Math.abs(dx)/180));
  });
  const end=()=>{
    if(!active)return;active=false;el.style.animation='';
    if(Math.abs(dx)>60){
      el.classList.add('out');app.toast[dev]=null;setTimeout(()=>el.remove(),180);
    }else{
      el.style.transition=`transform var(--dur-2) var(--ease-spring),opacity var(--dur-2)`;
      el.style.transform='translateX(-50%)';el.style.opacity='1';
      setTimeout(()=>{el.style.transition='';el.style.transform='';el.style.opacity=''},200);
    }
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function bindSheetDrag(dev){
  const sheet=APPS[dev]?.querySelector('.sheet');
  const grab=sheet?.querySelector('.grab');
  if(!sheet||!grab||sheet.dataset.drag)return;
  sheet.dataset.drag='1';
  const dim=APPS[dev].querySelector('.dim');
  let start=0,dy=0,active=false,last=0,lastT=0;
  const setY=y=>{sheet.style.transform=`translate3d(0,${y}px,0)`;};
  grab.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    active=true;start=last=e.clientY;lastT=performance.now();dy=0;
    sheet.classList.add('dragging');grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove',e=>{
    if(!active)return;
    dy=Math.max(0,e.clientY-start);last=e.clientY;lastT=performance.now();setY(dy);
    if(dim)dim.style.opacity=String(Math.max(.15,1-dy/340));
  });
  const end=()=>{
    if(!active)return;active=false;
    const velocity=dy/Math.max(1,performance.now()-lastT);
    sheet.classList.remove('dragging');
    if(dy>90||velocity>.55){closeSheet(dev);return}
    sheet.style.transition='transform var(--dur-2) var(--ease-spring)';setY(0);
    if(dim)dim.style.opacity='';
    setTimeout(()=>{sheet.style.transition='';sheet.style.transform='';},220);
  };
  grab.addEventListener('pointerup',end);grab.addEventListener('pointercancel',end);
}
function bindPullRefresh(dev){
  if(prefersReduced())return;
  const sc=APPS[dev]?.querySelector('.content,.pad-content');
  if(!sc||sc.dataset.ptr)return;
  sc.dataset.ptr='1';
  let start=null,dy=0,active=false;
  sc.addEventListener('touchstart',e=>{
    if(sc.scrollTop<=0&&e.touches.length===1){start=e.touches[0].clientY;active=true;dy=0}
  },{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(!active)return;
    dy=e.touches[0].clientY-start;
    if(dy<=0){sc.style.transform='';return}
    if(e.cancelable)e.preventDefault();
    const d=Math.min(56,dy*.42);
    sc.style.transition='none';sc.style.transform=`translate3d(0,${d}px,0)`;
  },{passive:false});
  const end=()=>{
    if(!active)return;active=false;
    sc.style.transition='transform var(--dur-3) var(--ease-spring)';
    if(dy*.42>46){
      sc.style.transform='translate3d(0,44px,0)';
      setTimeout(()=>{sc.style.transform='';sc.style.transition='';toast(dev,'Up to date')},190);
    }else{
      sc.style.transform='';setTimeout(()=>{sc.style.transition=''},220);
    }
    start=null;dy=0;
  };
  sc.addEventListener('touchend',end);sc.addEventListener('touchcancel',end);
}
function syncSideIndicator(dev){
  if(dev!=='pad')return;

  if(prev==null||prev===y){bar.style.transition='none';bar.style.transform=`translateY(${y}px)`;requestAnimationFrame(()=>{bar.style.transition=''})}

    bar.style.transition='none';bar.style.transform=`translateY(${prev}px)`;void bar.offsetHeight;

}

function visibleDocs(){

  if(app.sort==='Price: low')list=[...list].sort((a,b)=>a.price-b.price);

   ============================================================ */
const entryFor=id=>app.entries[id]||(app.entries[id]={rev:'',lab:'',food:'',other:'',notes:''});
function entryValues(dev){
  const root=document.querySelector(`[data-device="${dev}"]`);
  const draft=entryFor(app.entryClient);
  const q=k=>Number((root?.querySelector(`[data-entry="${k}"]`)?.value||draft[k]||'0').replace(/[^0-9.]/g,''))||0;
  return {rev:q('rev'),lab:q('lab'),food:q('food'),other:q('other')};
}
function entryCalc(v){
  const profit=v.rev-v.lab-v.food-v.other;
  const margin=v.rev?profit/v.rev*100:0;
  return {profit,margin};
}
function applyPublished(v,c){
  const o=CLIENT_DATA.Oct, prior=(FIN_PRIOR[9]||175.9)*1000;
  const labour=v.lab/v.rev*100, food=v.food/v.rev*100;
  const sign=n=>(n>=0?'+':'')+n.toFixed(1);
  o.rev=money(v.rev);o.revD=sign((v.rev-prior)/prior*100)+'%';
  o.margin=c.margin.toFixed(1)+'%';
  const sep=parseFloat(CLIENT_DATA.Sep.margin)||18.3;
  o.marginD=sign(c.margin-sep)+' pt';
  o.labour=labour.toFixed(1)+'%';o.labourD=sign(labour-32)+' pt';
  o.food=food.toFixed(1)+'%';
  const r=KPI_ROWS;
  r[0].v='A$'+(v.rev/1000).toFixed(1)+'k';r[0].status=v.rev>=180000?'On track':'Watch';
  r[1].v=o.margin;r[1].status=c.margin>=16?'On track':'Watch';
  r[2].v=o.labour;r[2].status=labour<=32?'On track':'Watch';
  r[3].v=o.food;r[3].status=food<=28.2?'On track':'Watch';
}
function entryForm(dev){
  const c=CLIENTS.find(x=>x.id===app.entryClient)||CLIENTS[0];

  const calc=entryCalc(v);
  const field=(k,label,val)=>`<div class="field"><label>${label}</label><div class="input"><span class="t-11 faint" style="margin-right:2px">A$</span><input data-entry="${k}" data-input="entry" inputmode="decimal" value="${Number(val).toLocaleString('en-AU')}" aria-label="${label}"></div></div>`;

    ${app.entryPublished?`<div class="banner" style="margin-top:var(--s-2)">${icon('checkCircle',15)}<span class="grow">Published to ${CLIENTS.find(c=>c.id===app.entryClient)?.n||CLIENT.name}</span></div>`:''}

  if(pad){
    if(step===1||step===4)return {header:head,body:content};
    if(step===2)return {header:head,body:`${csvStepper(2)}${csvMapping()}${csvPreview()}<div class="banner">${icon('checkCircle',15)}<span class="grow">Map each column, then preview.</span></div><div class="row" style="gap:var(--s-2)"><button class="btn secondary" data-act="csv-back">Back</button><button class="btn primary" data-act="csv-next">Continue to preview</button></div>`};
    return {header:head,body:`${csvStepper(3)}${csvPreview()}<div class="card"><div class="card-h"><h4>Validation</h4>${C.chip('31 of 31 valid','pos',true)}</div><div class="stack tight">${['No missing dates','No duplicate days','All values in AUD'].map(t=>`<div class="row" style="gap:var(--s-1);font-size:var(--text-xs)">${icon('check',13,2.4)}<span>${t}</span></div>`).join('')}</div></div><div class="banner">${icon('shield',16)}<span class="grow">Importing replaces October figures for this client only.</span></div><div class="row" style="gap:var(--s-2)"><button class="btn secondary" data-act="csv-back">Back to mapping</button><button class="btn primary" data-act="csv-confirm">Confirm import</button></div>`};

  }
  return {header:head,body:content,tab:'settings'};
}

  }

    return `<div class="empty"><div class="e-ic neg">${icon('alert',28)}</div><h3>Couldn’t load your library</h3><p>Check your connection and try again. Your purchases are safe on the server.</p><button class="btn primary sm" data-act="retry">Retry</button></div>`;
  }
  return `<div class="empty"><div class="e-ic">${icon('file',28)}</div><h3>Your library is empty</h3><p>Documents you buy or subscribe to appear here, with every new version.</p><button class="btn primary sm" data-act="tab" data-tab="catalog">Browse catalog</button></div>`;
}
function libraryRows(dev){

  if(app.dataState==='loading')return emptyState('loading',dev);

  if(app.dataState==='empty')return emptyState('empty',dev);
  if(!list.length)return `<div class="empty" style="min-height:220px"><div class="e-ic">${icon('checkCircle',26)}</div><h3>Everything is current</h3><p>No new versions waiting. We’ll alert you when something changes.</p></div>`;
  const badge=e=>e.status==='update'?C.chip(e.newVersion+' ready','warn'):e.status==='downloading'?C.chip('Downloading '+Math.round(e.progress)+'%','primary'):e.status==='notdownloaded'?C.chip('Not downloaded','neutral'):C.chip(e.version,'pos',true);
  const action=e=>e.status==='update'?`<button class="btn primary sm" data-act="update-entry" data-id="${e.id}">Update</button>`:e.status==='notdownloaded'?`<button class="btn primary sm" data-act="download-entry" data-id="${e.id}">Download</button>`:`<button class="btn sm outline" data-act="open-viewer" data-id="${e.id}">Open</button>`;
  if(dev==='pad'){

      return `<button class="item" style="${sel?'background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)':''}" data-act="select-library" data-id="${e.id}">${C.cover(d,42,54,true,true)}<div class="grow"><div class="t1">${d.t}</div><div class="t2">${d.cat} · ${e.version} · ${e.size}</div></div>${badge(e)}</button>`;
    }).join('')}</div>`;
  }
  return `<div class="list">${list.map(e=>{
    const d=docById(e.id);
    const t2=e.status==='update'?`<span style="color:var(--warn);font-weight:600">Version ${e.newVersion.replace(/^v/,'')} available</span>`:e.status==='downloading'?`Downloading ${Math.round(e.progress)}% · ${e.size}`:e.status==='notdownloaded'?`${e.version} · Not downloaded`:`${e.version} · Downloaded · ${e.size}`;
    const rowAct=e.status==='update'?'update-entry':e.status==='notdownloaded'?'download-entry':'open-viewer';
    return `<button class="item" data-act="${rowAct}" data-id="${e.id}">${C.cover(d,40,52,true,true)}<div class="grow"><div class="t1">${d.t}</div><div class="t2">${t2}</div>${e.status==='downloading'?`<div style="margin-top:var(--s-1)">${C.bar(e.progress)}</div>`:''}</div>${e.status==='update'?`<span class="chip warn">Update</span>`:e.status==='downloading'?`<span class="chip primary">${Math.round(e.progress)}%</span>`:e.status==='notdownloaded'?`<span class="chip neutral">Download</span>`:`<span class="chev">${icon('chevR',15)}</span>`}</button>`;
  }).join('')}</div>`;
}

        ${sel.status==='downloading'?`<div style="margin-top:var(--s-2)">${C.bar(sel.progress)}</div>`:''}
        <div class="row" style="gap:var(--s-2);margin-top:var(--s-3)">${sel.status==='update'?`<button class="btn primary sm" data-act="update-entry" data-id="${sel.id}">Update</button>`:`<button class="btn primary sm" data-act="open-viewer" data-id="${sel.id}">${icon('eye',14)}Open</button>`}<button class="btn sm outline" data-act="download-entry" data-id="${sel.id}">${icon('download',14)}${sel.status==='downloading'?'Cancel':'Download'}</button></div>
      </div>
      <div class="card"><div class="card-h"><h4>Version history</h4>${C.chip('2 this year','neutral')}</div><table class="tbl"><thead><tr><th scope="col">Version</th><th scope="col">Published</th></tr></thead><tbody><tr><td><b>${sel.version}</b></td><td class="muted">${sd.upd}</td></tr><tr><td>${prevVersion(sel.version)}</td><td class="muted">${monthsAgo(sd.upd,3)}</td></tr></tbody></table></div>
      <div class="banner">${icon('lock',15)}<span class="grow">Links expire after 72 hours. Downloads are watermarked.</span></div>
    </div>`;
    return {header:head,body:`<div class="lib-grid" style="flex:1"><div class="stack" style="gap:var(--s-2)">${tabs}${libraryRows(dev)}</div>${detail}</div>`};
  }
  return {header:lgHead('Library',counts,live?`<button class="icon-btn" data-act="download-all" aria-label="Download all">${icon('download',20)}</button>`:''),body:`${tabs}${padding}${libraryRows(dev)}${downloads}<div class="between" style="margin-top:auto"><span class="t-11 faint">3.2 GB available on this iPhone</span><button class="t-11 strong tap" style="color:var(--primary)" data-act="manage-storage">Manage storage</button></div>`,tab:'library'};
}

/* ============================================================
   ACTIONS
   ============================================================ */
function addLibrary(id){
  if(libEntry(id))return;
  library.push({id,version:docById(id).v,status:'downloading',progress:0,size:'—'});
}
function setDownload(id){
  const e=libEntry(id);
  if(!e){library.push({id,version:docById(id).v,status:'downloading',progress:4,size:'—'});return}
  if(e.status==='update'&&e.newVersion)e.targetVersion=e.newVersion;
  e.status='downloading';e.progress=4;
}
function startCheckout(dev,kind,id){
  const item=kind==='doc'?docById(id):BUNDLES.find(b=>b.id===id);
  if(!item)return;
  app.cart={kind,id,title:item.t,price:item.price,meta:kind==='doc'?item.v+' · one-time purchase':item.v+' · bundle'};
  go(dev,'checkout');
}
function processPayment(dev){
  if(!app.cart)return;
  const root=document.querySelector(`[data-device="${dev}"]`);
  const email=(root?.querySelector('#receipt-'+dev)?.value||roleEmail()).trim();
  ui[dev].sheet={type:'processing'};renderDevice(dev);
  const c={...app.cart};
  setTimeout(()=>{
    if(c.kind==='doc')addLibrary(c.id);
    else if(c.kind==='bundle'){const b=BUNDLES.find(x=>x.id===c.id);if(b)b.items.forEach(addLibrary)}
    app.orderSeq=app.orderSeq||2043;
    const order='A-'+(app.orderSeq++);
    app.lastPurchase={kind:c.kind,id:c.id,title:c.title,price:c.price,order,email};
    const receipt=app.updates.find(n=>n.id==='n3');if(receipt){receipt.title='Receipt for order #'+order;receipt.body=money2(c.price)+' · 17 Nov 2026'}
    app.cart=null;ui[dev].sheet=null;
    nav[dev]={screen:'success',params:{},stack:[]};
    renderNav(dev,'push');
    pushHist();
    toast(dev,'Payment approved');
  },1100);
}
function subscribe(dev){
  app.subscribed=true;
  DOCS.forEach(d=>{if(!libEntry(d.id))library.push({id:d.id,version:d.v,status:'downloading',progress:0,size:'—'})});
  app.orderSeq=app.orderSeq||2043;
  app.renewsOn=Date.now()+(app.billing==='annual'?365:30)*86400000;
  app.lastPurchase={kind:'plan',title:'AmiWho Pro',price:app.billing==='annual'?PLANS.annual:PLANS.monthly,order:'A-'+(app.orderSeq++),email:roleEmail()};
  nav[dev]={screen:'success',params:{},stack:[]};
  renderNav(dev,'push');
  pushHist();
  toast(dev,'AmiWho Pro is active');
}
function downloadPurchase(dev){
  const p=app.lastPurchase;if(!p)return;
  if(p.kind==='doc')setDownload(p.id);
  else if(p.kind==='bundle'){const b=BUNDLES.find(x=>x.id===p.id);if(b)b.items.forEach(setDownload)}
  else{DOCS.forEach(d=>setDownload(d.id));library.forEach(e=>{if(e.status==='update')setDownload(e.id)})}
  go(dev,'library');
}
function completeSignIn(){
  app.signedIn=true;app.authError='';
  applyRoleNav(app.role);
}
function signIn(dev){
  const email=document.getElementById('email-'+dev)?.value.trim();
  const pass=document.getElementById('pass-'+dev)?.value;
  if(!email||!pass){app.authError='Enter your email and password.';renderDevice(dev);return}
  app.authError='';completeSignIn();
}
function signOut(){
  app.signedIn=false;app.cart=null;app.authError='';
  ['phone','pad'].forEach(d=>{nav[d]={screen:'signin',params:{},stack:[]};ui[d].sheet=null});
  renderAll();
}
function setDataState(v){
  app.dataState=v;
  renderAll();
}
function refreshCatalog(dev){
  const el=document.getElementById('cat-list-'+dev);
  if(el)el.innerHTML=catalogItems(dev);
  const c=document.getElementById('cat-count-'+dev);
  const n=visibleDocs().length;
  if(c)c.textContent=n+' document'+(n===1?'':'s');
}
function updateEntryCalc(dev){
  const root=document.querySelector(`[data-device="${dev}"]`);
  if(!root)return;
  const v=entryValues(dev),c=entryCalc(v);
  const m=root.querySelector('.calc-margin');if(m)m.textContent=c.margin.toFixed(1)+'%';
  const p=root.querySelector('.calc-profit');if(p)p.textContent=money(c.profit);
}
function toggleRotate(){
  app.ipadLandscape=!app.ipadLandscape;
  const pad=document.querySelector('[data-device="pad"]');
  pad.classList.toggle('landscape',app.ipadLandscape);
  const size=document.getElementById('padSize');
  if(size)size.textContent=app.ipadLandscape?'1180 × 820':'820 × 1180';
  renderDevice('pad');
  fitStage();
}
function closeSheet(dev){
  if(!dev)return;
  const sheet=APPS[dev]?.querySelector('.sheet');
  const target=ui[dev].sheet;
  if(!sheet||prefersReduced()){ui[dev].sheet=null;renderDevice(dev);return}
  const dim=APPS[dev].querySelector('.dim');
  sheet.style.transition='transform var(--dur-2) var(--ease-in)';
  sheet.style.transform='translate3d(0,100%,0)';
  if(dim)dim.style.opacity='0';
  setTimeout(()=>{
    if(ui[dev].sheet!==target)return;
    ui[dev].sheet=null;renderDevice(dev);
    const fr=ui[dev].focusReturn;
    if(fr){
      const selector=`[data-act="${fr.act}"]${fr.id?`[data-id="${fr.id}"]`:''}`;
      const t=APPS[dev].querySelector(selector);
      if(t)t.focus({preventScroll:true});
      ui[dev].focusReturn=null;
    }
  },180);
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const dev=el.closest('[data-device]')?.dataset.device||null;
  const d=dev||'phone';
  const act=el.dataset.act;
  if(!el.closest('.sheet')&&['add-bundle','upload-open','price-open','user-open','invite','applepay','apple'].includes(act))ui[d].focusReturn={act,id:el.dataset.id||''};
  try{
    switch(act){
      case 'tab': go(d,el.dataset.tab,{},{root:true,motion:'fade'});break;
      case 'sidebar-toggle': {
        app.sidebarCollapsed=!app.sidebarCollapsed;
        const bar=APPS[d]?.querySelector('.sidebar');
        if(!bar){renderDevice(d);break}
        bar.classList.toggle('collapsed',app.sidebarCollapsed);
        const btn=bar.querySelector('.side-toggle');
        if(btn){btn.setAttribute('aria-expanded',String(!app.sidebarCollapsed));btn.setAttribute('aria-label',app.sidebarCollapsed?'Expand sidebar':'Collapse sidebar');btn.title=app.sidebarCollapsed?'Expand sidebar':'Collapse sidebar'}
        break;
      }
      case 'side': go(d,el.dataset.screen,{},{root:true,motion:'fade'});break;
      case 'back': back(d);break;
      case 'open-doc': go(d,'doc',{id:el.dataset.id});break;
      case 'open-bundle': go(d,'plans',{tab:'bundles'});break;
      case 'plans': go(d,'plans',{tab:'plans'});break;
      case 'plans-bundles': go(d,'plans',{tab:'bundles'});break;
      case 'plans-tab': nav[d].params.tab=el.dataset.tab;renderDevice(d);break;
      case 'billing': app.billing=el.dataset.value;renderDevice(d);break;
      case 'subscribe': subscribe(d);break;
      case 'buy-doc': startCheckout(d,'doc',el.dataset.id);break;
      case 'buy-bundle': startCheckout(d,'bundle',el.dataset.id);break;
      case 'add-bundle': ui[d].sheet={type:'bundle',docId:el.dataset.id};renderDevice(d);break;
      case 'choose-bundle': ui[d].sheet=null;startCheckout(d,'bundle',el.dataset.id);break;
      case 'applepay': ui[d].sheet={type:'applepay'};renderDevice(d);break;
      case 'pay-confirm': ui[d].sheet=null;processPayment(d);break;
      case 'pay-card': processPayment(d);break;
      case 'select-card': toast(d,'Visa 4242 selected');break;
      case 'add-card': toast(d,'Card setup is handled by Apple Pay');break;
      case 'download-purchase': downloadPurchase(d);break;
      case 'open-library': go(d,'library');break;
      case 'open-viewer': app.viewer={id:el.dataset.id||'labour',page:1,expiry:Date.now()+598000};go(d,'viewer');break;
      case 'viewer-page': app.viewer.page=Number(el.dataset.page);renderDevice(d);break;
      case 'renew-link': app.viewer.expiry=Date.now()+598000;toast(d,'Secure link renewed');renderDevice(d);break;
      case 'update-entry': {const en=libEntry(el.dataset.id);toast(d,'Downloading '+(en?.newVersion||docById(el.dataset.id).v));if(en){en.status='downloading';en.progress=4;en.targetVersion=en.newVersion}renderDevice(d);break;}
      case 'download-entry': {const en=libEntry(el.dataset.id);if(en){if(en.status==='downloading'){en.status='notdownloaded';en.progress=0;toast(d,'Download cancelled')}else{en.status='downloading';en.progress=4;en.targetVersion=en.newVersion;toast(d,'Downloading')}}renderDevice(d);break;}
      case 'download-all': library.forEach(en=>{en.status='downloading';en.progress=4;if(en.newVersion)en.targetVersion=en.newVersion});toast(d,'Downloading '+library.length+' documents');renderDevice(d);break;
      case 'mark-all': app.updates.forEach(n=>n.unread=false);renderAll();break;
      case 'updates-filter': app.updatesFilter=el.dataset.value;renderDevice(d);break;
      case 'open-update': {const n=app.updates.find(x=>x.id===el.dataset.id);if(n){n.unread=false;if(n.go==='doc')go(d,'doc',{id:n.docId});else go(d,n.go)}}break;
      case 'library-filter': app.libraryFilter=el.dataset.value;renderDevice(d);break;
      case 'select-library': app.libSelected=el.dataset.id;renderDevice(d);break;
      case 'cat': app.cat=el.dataset.cat;renderDevice(d);break;
      case 'catalog-cat': app.cat=el.dataset.cat;go(d,'catalog',{},{root:true});break;
      case 'catalog-all': app.cat='All';go(d,'catalog',{},{root:true});break;
      case 'clear-search': app.search='';renderDevice(d);break;
      case 'toggle': {
        const k=el.dataset.key;
        if(k==='compare')app.compare=!app.compare;
        else if(k.startsWith('acct-')){const n=k.slice(5);app.accountToggles[n]=!app.accountToggles[n];toast(d,(app.accountToggles[n]?'On':'Off')+' · '+n)}
        renderDevice(d);break;
      }
      case 'open-account': go(d,currentApp(nav[d].screen)==='client'?'settings':'account',{},{root:true});break;
      case 'workspace': {
        const a=el.dataset.app;
        const allowed=app.role==='admin'||(a==='doc'&&(app.role==='customer'||app.role==='staff'))||(a==='client'&&app.role==='client');
        if(!allowed){toast(d,'This workspace is not included in your role');break}
        const target=a==='doc'?'home':'overview';
        if(app.role==='admin'){
          ['phone','pad'].forEach(x=>{nav[x]={screen:target,params:{},stack:[]};ui[x].sheet=null});
          renderNavBoth('fade');
        }else go(d,target,{},{root:true,motion:'fade'});
        break;
      }
      case 'signin': signIn(d);break;
      case 'apple': ui[d].sheet={type:'faceid'};renderDevice(d);break;
      case 'faceid-ok': ui[d].sheet=null;completeSignIn();break;
      case 'auth-mode': app.authMode=el.dataset.mode;app.authError='';renderAll();break;
      case 'sheet-close': closeSheet(d);break;
      case 'signout': signOut();break;
      case 'reset': location.replace(location.pathname);break;
      case 'rotate': toggleRotate();break;
      case 'export': toast(d,'CSV exported · 42 KB');break;
      case 'share': toast(d,'Secure link copied · expires in 72 hours');break;
      case 'invite': ui[d].sheet={type:'invite'};renderDevice(d);break;
      case 'new-project': toast(d,'New project — use Projects on iPad');break;
      case 'save-draft': toast(d,'Draft saved');break;
      case 'publish': {
        const v=entryValues(d);
        if(!v.rev){toast(d,'Revenue is required before publishing');break}
        const c=entryCalc(v);
        const cl=CLIENTS.find(x=>x.id===app.entryClient)||CLIENTS[0];
        app.entryPublished=true;app.lastPublished='17 Nov 2026';
        if(cl.id==='marlow')applyPublished(v,c);
        toast(d,'Published to '+cl.n);
        renderDevice(d);break;
      }
      case 'client-select': app.entryClient=el.dataset.id;app.entryPublished=false;renderDevice(d);break;
      case 'csv-file': app.csvFile='october-sales.csv';app.csvStep=2;renderDevice(d);break;
      case 'csv-next': app.csvStep=Math.min(4,app.csvStep+1);renderDevice(d);break;
      case 'csv-back': app.csvStep=Math.max(1,app.csvStep-1);renderDevice(d);break;
      case 'csv-confirm': {app.csvStep=4;app.csvDone=true;const v={rev:199330,lab:59288,food:55645,other:41520};app.entries.marlow={rev:'199330',lab:'59288',food:'55645',other:'41520',notes:''};applyPublished(v,entryCalc(v));toast(d,'Imported 31 rows');renderDevice(d);break}
      case 'csv-reset': app.csvStep=1;app.csvFile=null;app.csvDone=false;renderDevice(d);break;
      case 'range': app.range=el.dataset.value;renderDevice(d);break;
      case 'cash-period': app.cashPeriod=el.dataset.value;renderDevice(d);break;
      case 'financial': go(d,'financial');break;
      case 'cashflow': go(d,'cashflow');break;
      case 'projects': go(d,'projects');break;
      case 'tasks': go(d,'tasks');break;
      case 'kpis': go(d,'kpis');break;
      case 'kpi-open': go(d,el.dataset.to);break;
      case 'project-filter': app.projectFilter=el.dataset.value;renderDevice(d);break;
      case 'open-project': app.selectedProject=el.dataset.id;go(d,'project',{id:el.dataset.id});break;
      case 'task-filter': app.taskFilter=el.dataset.value;renderDevice(d);break;
      case 'toggle-task': {
        const t=app.tasks.find(x=>x.id===el.dataset.id);
        if(t){t.done=!t.done;t.status=t.done?'Done':(t.status==='Done'?'To do':t.status)}
        renderDevice(d);
        if(t&&t.done){const btn=APPS[d].querySelector('[data-act="toggle-task"][data-id="'+el.dataset.id+'"]');if(btn)btn.classList.add('just-checked');if(navigator.vibrate)navigator.vibrate(8)}
        break;
      }
      case 'add-task': {
        const input=document.getElementById('newtask-'+d);
        const val=(input?.value||'').trim();
        if(!val){toast(d,'Add a task first');break}
        app.tasks.push({id:'t'+uid(),t:val,project:el.dataset.project||'winter',assignee:'You',initials:'YO',tone:'',due:'TBC',status:'To do',done:false});
        toast(d,'Task added');renderDevice(d);break;
      }
      case 'upload-open': ui[d].sheet={type:'upload',docId:el.dataset.id||'labour'};renderDevice(d);break;
      case 'upload-publish': {
        const root=document.querySelector(`[data-device="${d}"]`);
        const ver=(root.querySelector('#verInput')?.value||'').trim();
        const price=Number(root.querySelector('#priceInput')?.value);
        const doc=docById(el.dataset.id);
        const match=ver.match(/^v?(\d+(?:\.\d+)?)$/);
        if(!match){toast(d,'Enter a version like 2.5');break}
        if(!Number.isFinite(price)||price<=0){toast(d,'Enter a price above zero');break}
        doc.v='v'+match[1];doc.price=price;
        doc.upd='17 Nov 2026';doc.note=(root.querySelector('#noteInput')?.value||'').trim()||'Current release';
        const en=libEntry(doc.id);if(en){en.version=doc.v;en.status='downloaded';en.progress=100;delete en.newVersion;delete en.targetVersion;}
        app.updates.unshift({id:'n'+uid(),type:'file',title:doc.t+' updated to '+doc.v,body:'New version available in your library',unread:true,go:'library'});
        ui[d].sheet=null;toast(d,'Published '+doc.v+' · subscribers notified');renderDevice(d);break;
      }
      case 'price-open': ui[d].sheet={type:'price',docId:el.dataset.id};renderDevice(d);break;
      case 'price-save': {
        const root=document.querySelector(`[data-device="${d}"]`);
        const price=Number(root.querySelector('#priceOnly')?.value);
        const doc=docById(el.dataset.id);
        if(!Number.isFinite(price)||price<=0){toast(d,'Enter a price above zero');break}
        doc.price=price;
        ui[d].sheet=null;toast(d,'Price updated to '+money(price));renderDevice(d);break;
      }
      case 'invite-send': {
        const root=document.querySelector(`[data-device="${d}"]`);
        const email=(root.querySelector('#inviteEmail')?.value||'').trim();
        const role=root.querySelector('#inviteRole')?.value||'Client';
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast(d,'Enter a valid email');break}
        const name=email.split('@')[0].replace(/[._-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
        app.users.push({id:'u'+uid(),n:name,e:email,role,client:'Marlow & Fern',last:'Invited',initials:name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),tone:'a2'});
        ui[d].sheet=null;toast(d,'Invite sent to '+email);renderDevice(d);break;
      }
      case 'user-open': ui[d].sheet={type:'role',userId:el.dataset.id};renderDevice(d);break;
      case 'set-role': {
        const u=app.users.find(x=>x.id===el.dataset.id);
        if(u){u.role=el.dataset.role;toast(d,u.n+' is now '+u.role)}
        ui[d].sheet=null;renderDevice(d);break;
      }
      case 'user-filter': app.userFilter=el.dataset.value;renderDevice(d);break;
      case 'retry': app.dataState='live';document.getElementById('stateSel').value='live';renderAll();break;
      case 'view-month': app.clientMonth=el.dataset.month||'Oct';app.dataState='live';document.getElementById('stateSel').value='live';renderAll();break;
      case 'overview': go(d,'overview');break;
      case 'manage-storage': toast(d,'Storage: 2.4 GB of 5.6 GB used');break;
      case 'compare': app.compare=!app.compare;renderDevice(d);break;
      case 'dataentry': if(app.role==='admin')go(d,'dataentry');else toast(d,'Admin only');break;
      case 'import': if(app.role==='admin')go(d,'import');else toast(d,'Admin only');break;
    }
  }catch(err){console.error(err)}
});

document.addEventListener('input',e=>{
  const dev=e.target.closest('[data-device]')?.dataset.device;
  if(!dev)return;
  if(e.target.matches('[data-input="search"]')){app.search=e.target.value;refreshCatalog(dev)}
  else if(e.target.matches('[data-entry]')){entryFor(app.entryClient)[e.target.dataset.entry]=e.target.value;updateEntryCalc(dev)}
});
document.addEventListener('change',e=>{
  const dev=e.target.closest('[data-device]')?.dataset.device;
  if(!dev)return;
  const sel=e.target;
  if(sel.dataset.select==='sort'){app.sort=sel.value;renderDevice(dev)}
  else if(sel.dataset.select==='entry-client'){app.entryClient=sel.value;app.entryPublished=false;renderDevice(dev)}
  else if(sel.dataset.select==='csv-map'){app.csvMap[sel.dataset.key]=sel.value}
});

/* demo controls */
document.getElementById('devSeg').addEventListener('click',e=>{const b=e.target.closest('[data-dev]');if(b)setView(b.dataset.dev)});
document.getElementById('themeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setTheme(b.dataset.mode)});
document.getElementById('roleSel').addEventListener('change',e=>{
  app.role=e.target.value;app.authError='';
  if(app.signedIn){
    if(app.role==='admin')goBoth('workspace');
    else goBoth(app.role==='client'?'overview':'home');
  }else renderAll();
});
document.getElementById('stateSel').addEventListener('change',e=>setDataState(e.target.value));
window.addEventListener('resize',fitStage);
document.addEventListener('focusin',e=>{
  if(!e.target.matches('input,select,textarea'))return;
  setTimeout(()=>e.target.scrollIntoView({block:'nearest',behavior:prefersReduced()?'auto':'smooth'}),60);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();return}
  if(e.key!=='Enter')return;
  const t=e.target;if(!t.matches('input,select,textarea'))return;
  const root=t.closest('[data-device]');if(!root)return;
  const submit=root.querySelector('[data-act="signin"]')||root.querySelector('[data-act="add-task"]');
  if(submit){e.preventDefault();submit.click()}
});
document.addEventListener('keydown',e=>{
  const open=['phone','pad'].find(d=>ui[d].sheet);
  if(!open)return;
  if(e.key==='Escape'){ui[open].sheet=null;renderDevice(open);return;}
  if(e.key!=='Tab')return;
  const sheet=APPS[open].querySelector('.sheet');if(!sheet)return;
  const f=[...sheet.querySelectorAll('button:not([disabled]),[href],input,select,textarea')].filter(el=>!el.disabled);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

/* download simulation */
setInterval(()=>{
  let changed=false;
  library.forEach(en=>{
    if(en.status==='downloading'&&en.progress<100){
      en.progress=Math.min(100,en.progress+7);
      if(en.progress>=100){
        en.status='downloaded';
        if(en.targetVersion){en.version=en.targetVersion;delete en.targetVersion}
        delete en.newVersion;
      }
      changed=true;
    }
  });
  if(changed){['phone','pad'].forEach(d=>{if(['library','viewer'].includes(nav[d].screen)&&!ui[d].sheet)renderDevice(d)})}
},500);
setInterval(()=>{['phone','pad'].forEach(d=>{if(nav[d].screen==='viewer'&&app.signedIn)APPS[d].querySelectorAll('.expiry').forEach(el=>el.textContent=viewerTime())})},1000);

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('role')&&['customer','client','admin','staff'].includes(q.get('role'))){app.role=q.get('role');document.getElementById('roleSel').value=app.role}
  if(q.get('theme')==='dark')setTheme('dark');
  if(q.get('state')&&['live','empty','loading','error'].includes(q.get('state'))){app.dataState=q.get('state');document.getElementById('stateSel').value=app.dataState}
  if(q.get('landscape')==='1'){app.ipadLandscape=true;document.querySelector('[data-device="pad"]').classList.add('landscape');document.getElementById('padSize').textContent='1180 × 820'}
  if(q.get('view')&&['phone','pad','both'].includes(q.get('view')))setView(q.get('view'));
  if(q.get('in')==='1'){
    app.signedIn=true;
    const screen=q.get('screen')||(app.role==='client'?'overview':app.role==='admin'?'workspace':'home');
    const params=q.get('id')?{id:q.get('id')}:{};
    if(screen==='viewer')app.viewer={id:params.id||'labour',page:1,expiry:Date.now()+598000};
    ['phone','pad'].forEach(d=>{nav[d]={screen,params:{...params},stack:[]}});
  }
  fitStage();
  renderAll();
  try{history.replaceState(histState(),'')}catch(e){}
})();
window.addEventListener('popstate',e=>{
  if(!e.state||!e.state.phone)return;
  nav.phone=e.state.phone;nav.pad=e.state.pad||nav.pad;
  ui.phone.sheet=null;ui.pad.sheet=null;
  renderAll();
});
</script>
